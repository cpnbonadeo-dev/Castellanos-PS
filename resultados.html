/* Editorial / data-journalism — informe territorial. Display serif (Fraunces) + Archivo para datos. Acento rojo PS. */
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --ink:#1a1714; --ink-soft:#6b6459; --line:#e3ddd0;
  --accent:#c1121f; --accent-soft:#f3d9db;
  --verde:#2d7d46; --verde-bg:#e4f0e5; --amar:#b87503; --amar-bg:#f8ecd4; --rojo:#c1121f; --rojo-bg:#f6dcde; --gris:#8a8373; --gris-bg:#eceae3;
  --disp:'Fraunces',Georgia,serif; --body:'Archivo',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#14120f; --surface:#1d1a16; --ink:#f0ece3; --ink-soft:#a39b8c; --line:#2e2a24;
  --accent:#f0576a; --accent-soft:#3a1c20;
  --verde:#5cc97a; --verde-bg:#1a2e20; --amar:#e0a63a; --amar-bg:#2e2512; --rojo:#f0576a; --rojo-bg:#2e171a; --gris:#9a9casdf; --gris:#8a8373; --gris-bg:#26231d;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14120f; --surface:#1d1a16; --ink:#f0ece3; --ink-soft:#a39b8c; --line:#2e2a24;
  --accent:#f0576a; --accent-soft:#3a1c20;
  --verde:#5cc97a; --verde-bg:#1a2e20; --amar:#e0a63a; --amar-bg:#2e2512; --rojo:#f0576a; --rojo-bg:#2e171a; --gris:#8a8373; --gris-bg:#26231d;
  color-scheme:dark;
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* Masthead */
.mast{border-bottom:3px solid var(--ink);padding:22px 0 16px;margin-bottom:4px}
.mast-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.mast-kicker{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent)}
.mast-date{font-size:11px;color:var(--ink-soft);font-weight:600;letter-spacing:.3px}
.mast-h1{font-family:var(--disp);font-size:clamp(34px,6vw,56px);font-weight:600;line-height:1.02;letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance}
.mast-sub{font-family:var(--disp);font-size:clamp(15px,2.2vw,19px);font-style:italic;color:var(--ink-soft);font-weight:400}
.reload{background:none;border:1px solid var(--line);color:var(--ink-soft);border-radius:30px;padding:7px 15px;font-family:var(--body);font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.3px;transition:all .15s}
.reload:hover{border-color:var(--accent);color:var(--accent)}
/* Standfirst con números */
.stand{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:20px 0 10px}
.stat{background:var(--surface);padding:16px 18px}
.stat-n{font-family:var(--disp);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat-l{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.8px;margin-top:5px;font-weight:600}
.n-verde{color:var(--verde)}.n-amar{color:var(--amar)}.n-accent{color:var(--accent)}.n-ink{color:var(--ink)}
/* Section headers editoriales */
.sec{margin:34px 0 14px;display:flex;align-items:baseline;gap:12px}
.sec-num{font-family:var(--disp);font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.sec-t{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.01em}
.sec-line{flex:1;height:1px;background:var(--line)}
.sec-note{font-size:12px;color:var(--ink-soft);font-style:italic;font-family:var(--disp)}
/* 4 grupos — la decisión, protagonista */
.grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px}
.grupo{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gris);padding:16px 18px}
.grupo.gv{border-left-color:var(--verde)}.grupo.ga{border-left-color:var(--amar)}
.grupo.gr{border-left-color:var(--rojo)}.grupo.gg{border-left-color:var(--gris)}
.gr-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
.gr-t{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.gr-n{font-family:var(--disp);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.gv .gr-t,.gv .gr-n{color:var(--verde)}.ga .gr-t,.ga .gr-n{color:var(--amar)}
.gr .gr-t,.gr .gr-n{color:var(--rojo)}.gg .gr-t,.gg .gr-n{color:var(--ink-soft)}
.gr-sub{font-size:11px;color:var(--ink-soft);margin-bottom:11px;font-style:italic;font-family:var(--disp)}
.gr-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 11px;border-radius:4px;cursor:pointer;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);transition:all .13s;font-family:var(--body)}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.chip .lk{font-size:10px;opacity:.6;font-weight:700}
.chip-empty{color:var(--ink-soft);font-size:12px;font-style:italic;font-family:var(--disp)}
/* FICHA */
.ficha{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent)}
.ficha-empty{color:var(--ink-soft);text-align:center;padding:44px 20px;font-style:italic;font-family:var(--disp);font-size:15px}
.fh{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.fh-loc{font-family:var(--disp);font-size:clamp(28px,4vw,40px);font-weight:600;line-height:1;letter-spacing:-.02em}
.fh-sub{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1.2px;margin-top:5px;font-weight:600}
.fh-badge{font-size:13px;font-weight:700;padding:7px 15px;border-radius:30px;white-space:nowrap;font-family:var(--body)}
.b-v{background:var(--verde-bg);color:var(--verde)}.b-a{background:var(--amar-bg);color:var(--amar)}
.b-r{background:var(--rojo-bg);color:var(--rojo)}.b-n{background:var(--gris-bg);color:var(--ink-soft)}
.fbody{padding:20px 24px 24px}
.bl{margin-bottom:22px}
.bl:last-child{margin-bottom:0}
.bl-t{font-family:var(--body);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
/* datos electorales */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:0;border:1px solid var(--line)}
.dato{padding:11px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.d-l{font-size:9px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.d-v{font-size:14px;font-weight:600;margin-top:3px;line-height:1.25}
.d-v.ps{color:var(--verde)}
/* mirada barras */
.mrow{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.m-l{font-size:12px;width:120px;flex-shrink:0;color:var(--ink-soft);font-weight:500}
.m-track{flex:1;height:26px;background:var(--bg);border:1px solid var(--line);overflow:hidden;position:relative}
.m-fill{height:100%;display:flex;align-items:center;padding-left:9px;font-size:12px;font-weight:700;color:#fff;min-width:30px;font-variant-numeric:tabular-nums;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.mf-v{background:var(--verde)}.mf-a{background:var(--amar)}.mf-r{background:var(--rojo)}
.m-pct{font-family:var(--disp);font-size:16px;font-weight:600;width:46px;text-align:right;font-variant-numeric:tabular-nums}
.m-base{font-size:11px;color:var(--ink-soft);margin-top:7px;font-style:italic;font-family:var(--disp)}
/* categorías */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px}
.cat{border:1px solid var(--line);padding:11px 13px;background:var(--bg)}
.cat.vacia{opacity:.45}
.c-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.c-ico{font-size:16px;line-height:1}
.c-name{font-size:12px;font-weight:600;flex:1;color:var(--ink)}
.c-n{font-family:var(--disp);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.c-bar{height:4px;background:var(--line);overflow:hidden;margin-bottom:6px}
.c-fill{height:100%}
.c-foot{display:flex;justify-content:space-between;align-items:center}
.c-pct{font-size:12px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.c-inc{font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.4px;font-family:var(--body)}
.i-alta{background:var(--verde-bg);color:var(--verde)}.i-media{background:var(--amar-bg);color:var(--amar)}
.i-baja{background:var(--gris-bg);color:var(--ink-soft)}.i-cero{background:transparent;color:var(--line)}
/* detalle vínculos */
.vdet{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.vd{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.vd:last-child{border-bottom:none}
.vd-ico{font-size:17px;line-height:1.2}
.vd-n{font-weight:600;font-size:14px}
.vd-c{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.vd-d{font-size:13px;color:var(--ink-soft);margin-top:1px}
/* mapa */
.mapwrap-outer{background:var(--surface);border:1px solid var(--line);padding:18px}
.map-wrap{position:relative;width:100%;max-width:560px;margin:0 auto}
#mapaBg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;opacity:.14;pointer-events:none;z-index:0}
#mapSvg{position:relative;z-index:1;width:100%;height:auto;display:block}
.map-leg{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:14px}
.ml{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);font-weight:500}
.ml-d{width:11px;height:11px;border-radius:50%}
.loading{text-align:center;padding:60px;color:var(--ink-soft);font-family:var(--disp);font-size:16px;font-style:italic}
.foot{margin:40px 0 20px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft);text-align:center;font-family:var(--disp);font-style:italic}
.dot-pulse{animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const BD={}; BASEDATA.forEach(b=>BD[b.id]=b);
const EVAL_DEF={actuar:{ico:'●',txt:'Tenemos oportunidades',col:'var(--verde)'},intentar:{ico:'●',txt:'Hay que intentarlo',col:'var(--amar)'},no:{ico:'●',txt:'Hay que profundizar',col:'var(--rojo)'}};
const COL={actuar:'#2d7d46',intentar:'#b87503',no:'#c1121f'};
const CATS=[
  {id:'persona',ico:'👤',name:'Referentes'},{id:'escuela',ico:'🎓',name:'Educación'},
  {id:'club',ico:'⚽',name:'Deporte'},{id:'salud',ico:'🏥',name:'Salud'},
  {id:'iglesia',ico:'⛪',name:'Comunitario'},{id:'institucion',ico:'🏛',name:'Institucional'},
  {id:'comercio',ico:'🏪',name:'Comercial'},{id:'cultural',ico:'🎭',name:'Cultural'},{id:'otro',ico:'📌',name:'Otro'}
];
const CATMAP={}; CATS.forEach(c=>CATMAP[c.id]=c);
let DATA={byLoc:{},evals:[],vncs:[]};
async function supa(path){const r=await fetch(SUPA_URL+"/rest/v1/"+path,{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}});return r.json();}
function consenso(evals){const c={actuar:0,intentar:0,no:0};evals.forEach(e=>{if(e.evaluacion!=='no_se')c[e.evaluacion]=(c[e.evaluacion]||0)+1;});const tot=c.actuar+c.intentar+c.no;if(tot===0)return{tipo:null,c,tot};let max='actuar',mv=c.actuar;if(c.intentar>mv){max='intentar';mv=c.intentar;}if(c.no>mv){max='no';mv=c.no;}return{tipo:max,c,tot};}
function incidencia(p){if(p>=40)return{lbl:'Alta',cls:'i-alta'};if(p>=20)return{lbl:'Media',cls:'i-media'};if(p>0)return{lbl:'Baja',cls:'i-baja'};return{lbl:'—',cls:'i-cero'};}
async function loadData(){
  document.getElementById('lastUpdate').textContent='Actualizando…';
  let evals,vncs;
  try{
    const res=await Promise.all([supa('evaluaciones?select=localidad_id,localidad_n,evaluacion,autor'),supa('vinculos?select=localidad,localidad_n,nombre,tipo,vinculo,oportunidad')]);
    evals=res[0];vncs=res[1];
    if(!Array.isArray(evals)||evals.length===0) throw 0;
  }catch(e){ evals=(typeof EMBED_EVALS!=='undefined')?EMBED_EVALS:[]; vncs=(typeof EMBED_VNCS!=='undefined')?EMBED_VNCS:[]; }
  const vncsClean=(vncs||[]).filter(v=>v.nombre!=='PRUEBA_DIAGNOSTICO_BORRAR');
  const byLoc={};BASEDATA.forEach(b=>byLoc[b.id]={evals:[],vncs:[],cons:null});
  evals.forEach(e=>{if(byLoc[e.localidad_id])byLoc[e.localidad_id].evals.push(e);});
  vncsClean.forEach(v=>{if(byLoc[v.localidad])byLoc[v.localidad].vncs.push(v);});
  BASEDATA.forEach(b=>{byLoc[b.id].cons=consenso(byLoc[b.id].evals);});
  DATA={byLoc,evals,vncs:vncsClean};
  const now=new Date().toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  const utiles=evals.filter(e=>e.evaluacion!=='no_se').length;
  const part=new Set(evals.map(e=>e.autor)).size;
  document.getElementById('lastUpdate').textContent=utiles+' opiniones · '+part+' participantes · '+vncsClean.length+' vínculos · '+now;
  render();
}
function render(){
  const {byLoc,evals,vncs}=DATA;
  const utiles=evals.filter(e=>e.evaluacion!=='no_se');
  const part=new Set(evals.map(e=>e.autor)).size;
  const T=[],A=[],N=[],F=[];
  BASEDATA.forEach(b=>{const c=byLoc[b.id].cons;if(!c.tipo)F.push(b);else if(c.tipo==='actuar')T.push(b);else if(c.tipo==='intentar')A.push(b);else N.push(b);});
  const grupo=(t,s,arr,cls)=>{
    const chips=arr.length?arr.map(b=>{const nv=byLoc[b.id].vncs.length;return '<span class="chip" onclick="showFicha(\''+b.id+'\')">'+b.n+(nv>0?' <span class="lk">'+nv+'🔗</span>':'')+'</span>';}).join(''):'<span class="chip-empty">Sin localidades por ahora</span>';
    return '<div class="grupo '+cls+'"><div class="gr-top"><span class="gr-t">'+t+'</span><span class="gr-n">'+arr.length+'</span></div><div class="gr-sub">'+s+'</div><div class="gr-chips">'+chips+'</div></div>';
  };
  let html='<div class="stand">'
    +'<div class="stat"><div class="stat-n n-verde">'+T.length+'</div><div class="stat-l">Donde trabajar</div></div>'
    +'<div class="stat"><div class="stat-n n-amar">'+A.length+'</div><div class="stat-l">Podemos avanzar</div></div>'
    +'<div class="stat"><div class="stat-n n-ink">'+part+'</div><div class="stat-l">Participantes</div></div>'
    +'<div class="stat"><div class="stat-n n-accent">'+vncs.length+'</div><div class="stat-l">Vínculos</div></div>'
    +'</div>';
  html+='<div class="sec"><span class="sec-num">01</span><span class="sec-t">El mapa de decisión</span><span class="sec-line"></span><span class="sec-note">de qué hablamos en cada lugar</span></div>';
  html+='<div class="grupos">'+grupo('Donde vamos a trabajar','Consenso del equipo: hay oportunidad',T,'gv')+grupo('Donde podemos avanzar','Señal positiva, vale el intento',A,'ga')+grupo('Por ahora no priorizamos','Sin oportunidad clara todavía',N,'gr')+grupo('Faltan relevar','Necesitamos más miradas de estas zonas',F,'gg')+'</div>';
  html+='<div class="sec"><span class="sec-num">02</span><span class="sec-t">La ficha de cada localidad</span><span class="sec-line"></span><span class="sec-note">tocá una para ver el detalle</span></div>';
  html+='<div class="ficha" id="fichaBox"><div class="ficha-empty">Elegí una localidad arriba o en el mapa para ver qué sabemos de ella</div></div>';
  html+='<div class="sec"><span class="sec-num">03</span><span class="sec-t">El territorio</span><span class="sec-line"></span><span class="sec-note">respaldo visual</span></div>';
  html+='<div class="mapwrap-outer"><div class="map-wrap" id="mapWrap"><img id="mapaBg" src="mapa_castellanos.png" alt="Mapa" onerror="this.style.display=\'none\'"><svg id="mapSvg" viewBox="0 0 775 1004" xmlns="http://www.w3.org/2000/svg"></svg></div>'
    +'<div class="map-leg"><span class="ml"><span class="ml-d" style="background:var(--verde)"></span>Trabajar</span><span class="ml"><span class="ml-d" style="background:var(--amar)"></span>Avanzar</span><span class="ml"><span class="ml-d" style="background:var(--rojo)"></span>No priorizar</span><span class="ml"><span class="ml-d" style="background:var(--gris)"></span>Falta relevar</span></div></div>';
  document.getElementById('main').innerHTML=html;
  drawMap();
}
function drawMap(){
  const svg=document.getElementById('mapSvg');if(!svg)return;const {byLoc}=DATA;let s='';
  BASEDATA.forEach(b=>{const p=PXMAP[b.id];if(!p)return;const c=byLoc[b.id].cons;const col=c.tipo?COL[c.tipo]:'#b8b0a0';const r=c.tipo?(8+Math.min(c.tot,5)*2):6;const pulse=c.tipo==='actuar'?' class="dot-pulse"':'';s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="'+col+'" fill-opacity="0.92" stroke="var(--surface)" stroke-width="1.5" style="cursor:pointer"'+pulse+' onclick="showFicha(\''+b.id+'\')"><title>'+b.n+'</title></circle>';});
  svg.innerHTML=s;
}
function showFicha(id){
  const bd=BD[id];const ld=DATA.byLoc[id];if(!bd||!ld)return;const c=ld.cons;const box=document.getElementById('fichaBox');
  let badge,bcls;
  if(c.tipo){const d=EVAL_DEF[c.tipo];badge=d.txt;bcls=c.tipo==='actuar'?'b-v':c.tipo==='intentar'?'b-a':'b-r';}
  else{badge='Sin lectura aún';bcls='b-n';}
  const gobPS=bd.psEjec;
  let datos='<div class="bl"><div class="bl-t">Lo que ya sabíamos</div><div class="dgrid">'
    +'<div class="dato"><div class="d-l">Tipo</div><div class="d-v">'+(bd.muni?'Municipio':'Comuna')+'</div></div>'
    +'<div class="dato"><div class="d-l">Gobierna</div><div class="d-v'+(gobPS?' ps':'')+'">'+(bd.gob||'—')+'</div></div>'
    +'<div class="dato"><div class="d-l">Electores</div><div class="d-v">'+(bd.el?bd.el.toLocaleString('es'):'—')+'</div></div>'
    +'<div class="dato"><div class="d-l">Centro PS</div><div class="d-v'+(bd.centroPS?' ps':'')+'">'+(bd.centroPS?'Sí':'No')+'</div></div>'
    +(bd.congresal?'<div class="dato"><div class="d-l">Congresales PS</div><div class="d-v ps">'+bd.congresal+'</div></div>':'')
    +'</div></div>';
  let mirada='<div class="bl"><div class="bl-t">La mirada del equipo</div>';
  if(c.tot>0){
    const pa=Math.round(c.c.actuar/c.tot*100),pi=Math.round(c.c.intentar/c.tot*100),pn=Math.round(c.c.no/c.tot*100);
    const row=(l,p,cl)=>p>0?'<div class="mrow"><span class="m-l">'+l+'</span><div class="m-track"><div class="m-fill '+cl+'" style="width:'+p+'%">'+(p>=12?p+'%':'')+'</div></div><span class="m-pct">'+p+'%</span></div>':'';
    mirada+=row('Oportunidad',pa,'mf-v')+row('Intentarlo',pi,'mf-a')+row('Profundizar',pn,'mf-r')+'<div class="m-base">Sobre '+c.tot+' opinión'+(c.tot>1?'es':'')+' del equipo</div>';
  }else{mirada+='<div style="font-size:13px;color:var(--ink-soft);font-style:italic;font-family:var(--disp)">Todavía nadie con conocimiento evaluó esta localidad.</div>';}
  mirada+='</div>';
  const totV=ld.vncs.length;const porCat={};CATS.forEach(x=>porCat[x.id]=0);
  ld.vncs.forEach(v=>{if(porCat[v.tipo]!==undefined)porCat[v.tipo]++;else porCat.otro++;});
  let cats='<div class="bl"><div class="bl-t">Vínculos por categoría ('+totV+')</div><div class="cgrid">';
  CATS.forEach(cat=>{const n=porCat[cat.id];const p=totV>0?Math.round(n/totV*100):0;const inc=incidencia(p);
    cats+='<div class="cat'+(n===0?' vacia':'')+'"><div class="c-top"><span class="c-ico">'+cat.ico+'</span><span class="c-name">'+cat.name+'</span><span class="c-n">'+n+'</span></div><div class="c-bar"><div class="c-fill" style="width:'+p+'%;background:'+(p>=40?'var(--verde)':p>=20?'var(--amar)':p>0?'var(--gris)':'transparent')+'"></div></div><div class="c-foot"><span class="c-pct">'+p+'%</span><span class="c-inc '+inc.cls+'">'+inc.lbl+'</span></div></div>';
  });
  cats+='</div>';
  if(totV>0){cats+='<div class="vdet">';ld.vncs.forEach(v=>{const cat=CATMAP[v.tipo]||{ico:'📌',name:v.tipo};cats+='<div class="vd"><span class="vd-ico">'+cat.ico+'</span><div><div class="vd-n">'+v.nombre+' <span class="vd-c">· '+cat.name+'</span></div>'+(v.vinculo?'<div class="vd-d">'+v.vinculo+'</div>':'')+'</div></div>';});cats+='</div>';}
  cats+='</div>';
  box.innerHTML='<div class="fh"><div><div class="fh-loc">'+bd.n+'</div><div class="fh-sub">Departamento Castellanos</div></div><div class="fh-badge '+bcls+'">'+badge+'</div></div><div class="fbody">'+datos+mirada+cats+'</div>';
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
loadData();
</script>
