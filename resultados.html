<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultados — PS Castellanos</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',Arial,sans-serif;background:#f5f0eb;color:#1a1a1a;min-height:100vh}

.hdr{background:#c62828;padding:0 24px;display:flex;align-items:center;justify-content:space-between;min-height:60px;position:sticky;top:0;z-index:10}
.hdr-left{display:flex;align-items:center;gap:12px}
.ps-rose{width:36px;height:36px;flex-shrink:0}
.hdr-title{font-family:'Oswald',Arial,sans-serif;font-size:18px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.65);margin-top:1px}
.reload-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 14px;font-size:11px;cursor:pointer;font-family:'Oswald',Arial,sans-serif;font-weight:600;letter-spacing:.3px}
.reload-btn:hover{background:rgba(255,255,255,.25)}

.hdr-stripe{height:5px;background:repeating-linear-gradient(90deg,#8b0000 0,#8b0000 30px,#c62828 30px,#c62828 60px)}

.container{max-width:960px;margin:0 auto;padding:20px 16px}

/* KPI boxes */
.kpi-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kpi-box{flex:1;min-width:100px;background:#fff;border:1px solid #ddd4c8;border-radius:4px;padding:12px 14px;text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.04)}
.kpi-val{font-family:'Oswald',Arial,sans-serif;font-size:24px;font-weight:700;color:#c62828}
.kpi-lbl{font-size:10px;color:#888;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

.section-title{font-family:'Oswald',Arial,sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#999;margin:18px 0 10px;border-left:3px solid #c62828;padding-left:8px}

/* Tabs */
.tab-row{display:flex;gap:4px;margin-bottom:14px}
.tab-btn{padding:6px 16px;border-radius:4px;border:1px solid #ddd4c8;background:#fff;color:#888;font-size:11px;font-weight:700;cursor:pointer;font-family:'Oswald',Arial,sans-serif;letter-spacing:.3px;text-transform:uppercase}
.tab-btn.active{background:#c62828;border-color:#c62828;color:#fff}

/* Filter */
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:11px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.filter-sel{background:#fff;border:1px solid #ddd4c8;color:#1a1a1a;border-radius:4px;padding:5px 10px;font-size:11px}

/* Legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.3px}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Grid */
.loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:16px}
.loc-card{background:#fff;border:1px solid #ddd4c8;border-radius:4px;padding:10px 12px;box-shadow:2px 2px 0 rgba(0,0,0,.04)}
.loc-card.e-actuar{border-left:4px solid #2e7d32}
.loc-card.e-intentar{border-left:4px solid #e65100}
.loc-card.e-no{border-left:4px solid #c62828}
.loc-card.e-no_se{border-left:4px solid #888}
.loc-card.e-none{border-left:4px solid #e0d8cc;opacity:.7}
.loc-name{font-family:'Oswald',Arial,sans-serif;font-size:13px;font-weight:600;color:#1a1a1a}
.loc-tipo{font-size:9px;color:#bbb;margin-top:1px;text-transform:uppercase;letter-spacing:.3px}
.loc-eval{font-size:11px;font-weight:700;margin-top:6px}
.loc-eval.e-actuar{color:#2e7d32}
.loc-eval.e-intentar{color:#e65100}
.loc-eval.e-no{color:#c62828}
.loc-eval.e-no_se{color:#888}
.loc-eval.e-none{color:#ccc}
.loc-authors{font-size:9px;color:#bbb;margin-top:3px}

/* Table */
.table-wrap{overflow-x:auto;margin-bottom:20px;border:1px solid #ddd4c8;border-radius:4px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#f5f0eb;color:#999;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-bottom:2px solid #c62828;text-align:left;font-size:10px;font-family:'Oswald',Arial,sans-serif;font-weight:600}
td{padding:8px 12px;border-bottom:1px solid #f0ebe4;color:#444}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdf8f4}
.pill{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;font-family:'Oswald',Arial,sans-serif;letter-spacing:.3px;text-transform:uppercase}
.pill-actuar{background:#e8f5e9;color:#2e7d32}
.pill-intentar{background:#fff3e0;color:#e65100}
.pill-no{background:#ffebee;color:#c62828}
.pill-no_se{background:#f5f5f5;color:#888}

.loading{text-align:center;padding:40px;color:#bbb;font-family:'Oswald',Arial,sans-serif;font-size:14px;letter-spacing:.5px;text-transform:uppercase}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <svg class="ps-rose" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="20.5" y="22" width="3" height="18" rx="1.5" fill="#a5d6a7"/>
      <ellipse cx="16" cy="32" rx="5" ry="2.5" transform="rotate(-30 16 32)" fill="#81c784"/>
      <ellipse cx="22" cy="16" rx="6" ry="9" fill="#fff"/>
      <ellipse cx="16" cy="18" rx="5" ry="7" transform="rotate(-25 16 18)" fill="rgba(255,255,255,.8)"/>
      <ellipse cx="28" cy="18" rx="5" ry="7" transform="rotate(25 28 18)" fill="rgba(255,255,255,.8)"/>
      <ellipse cx="22" cy="12" rx="4" ry="6" fill="rgba(255,255,255,.9)"/>
      <circle cx="22" cy="16" r="3" fill="rgba(198,40,40,.4)"/>
    </svg>
    <div>
      <div class="hdr-title">Partido Socialista · Resultados territoriales</div>
      <div class="hdr-sub" id="lastUpdate">Cargando...</div>
    </div>
  </div>
  <button class="reload-btn" onclick="loadData()">↺ Actualizar</button>
</div>
<div class="hdr-stripe"></div>

<div class="container">
  <div id="main"><div class="loading">Cargando datos...</div></div>
</div>

<script>
const SUPA_URL="https://ikaadszatnbmzjrjvmkv.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrYWFkc3phdG5ibXpqcmp2bWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mjc1ODMsImV4cCI6MjA5NzEwMzU4M30.QS4ClCaryH56pGAVc4ICS_eHC1LZmvQFrR4KNri3GSs";

const BASE=[
  {id:"rafaela",n:"Rafaela",G:true},{id:"sunchales",n:"Sunchales",G:true},{id:"frontera",n:"Frontera",G:true},{id:"san_vicente",n:"San Vicente",G:true},{id:"humberto",n:"Humberto Primo",G:true},{id:"maria_juana",n:"Maria Juana",G:true},{id:"col_aldao",n:"Colonia Aldao",G:false},{id:"angelica",n:"Angelica",G:false},{id:"ataliva",n:"Ataliva",G:false},{id:"aurelia",n:"Aurelia",G:false},{id:"bauer_sigel",n:"Bauer y Sigel",G:false},{id:"bella_italia",n:"Bella Italia",G:false},{id:"col_bicha",n:"Col. Bicha",G:false},{id:"col_bigand",n:"Col. Bigand",G:false},{id:"castellanos_c",n:"Castellanos",G:false},{id:"col_cello",n:"Colonia Cello",G:false},{id:"col_iturraspe",n:"Col. Iturraspe",G:false},{id:"col_margarita",n:"Col. Margarita",G:false},{id:"maua",n:"Maua",G:false},{id:"col_raquel",n:"Colonia Raquel",G:false},{id:"coronel_fraga",n:"Coronel Fraga",G:false},{id:"plaza_cluc",n:"Plaza Clucellas",G:false},{id:"egusquiza",n:"Egusquiza",G:false},{id:"esmeralda",n:"Esmeralda",G:false},{id:"est_cluc",n:"Est. Clucellas",G:false},{id:"eusebia",n:"Eusebia y Carolina",G:false},{id:"eustolia",n:"Eustolia",G:false},{id:"fidela",n:"Fidela",G:false},{id:"galisteo",n:"Galisteo",G:false},{id:"garibaldi",n:"Garibaldi",G:false},{id:"hugentobler",n:"Hugentobler",G:false},{id:"josefina",n:"Josefina",G:false},{id:"lehmann",n:"Lehmann",G:false},{id:"pte_roca",n:"Presidente Roca",G:false},{id:"pueblo_marini",n:"Pueblo Marini",G:false},{id:"ramona",n:"Ramona",G:false},{id:"saguier",n:"Saguier",G:false},{id:"san_antonio",n:"San Antonio",G:false},{id:"sta_clara",n:"Sta. Clara de Saguier",G:false},{id:"susana",n:"Susana",G:false},{id:"tacural",n:"Tacural",G:false},{id:"tacurales",n:"Tacurales",G:false},{id:"vila",n:"Vila",G:false},{id:"villa_san_jose",n:"Villa San Jose",G:false},{id:"virginia",n:"Virginia",G:false},{id:"zenon_pereyra",n:"Zenon Pereyra",G:false}
];

const EVAL_DEF={
  actuar: {ico:'✅', txt:'Tenemos oportunidades', cls:'actuar'},
  intentar:{ico:'🔄', txt:'Hay que intentarlo',    cls:'intentar'},
  no:      {ico:'🚫', txt:'No conviene ahora',      cls:'no'},
  no_se:   {ico:'🤷', txt:'Sin conocimiento',       cls:'no_se'},
};

let curView='grid', filterAutor='todos';

async function supa(path){
  const r=await fetch(`${SUPA_URL}/rest/v1/${path}`,{headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}});
  return r.json();
}

async function loadData(){
  document.getElementById('lastUpdate').textContent='Actualizando...';
  const [evals, vncs] = await Promise.all([
    supa('evaluaciones?select=autor,evaluacion,localidad_id,localidad_n,created_at&order=created_at.desc'),
    supa('vinculos?select=localidad,autor,nombre,tipo,created_at&order=created_at.desc&limit=500'),
  ]);
  const now=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('lastUpdate').textContent=`Actualizado ${now} · ${evals.length} evaluaciones · ${new Set(evals.map(e=>e.autor)).size} persona/s`;
  render(evals, vncs);
}

function render(evals, vncs){
  const byLoc={};
  const byAutor={};
  BASE.forEach(b=>{ byLoc[b.id]={evals:[],vncs:[]}; });
  evals.forEach(e=>{
    if(byLoc[e.localidad_id]) byLoc[e.localidad_id].evals.push(e);
    byAutor[e.autor]=(byAutor[e.autor]||0)+1;
  });
  vncs.forEach(v=>{ if(byLoc[v.localidad]) byLoc[v.localidad].vncs.push(v); });

  BASE.forEach(b=>{
    const es=byLoc[b.id].evals;
    if(!es.length){byLoc[b.id].consensus=null;return;}
    const cnt={};
    es.forEach(e=>cnt[e.evaluacion]=(cnt[e.evaluacion]||0)+1);
    byLoc[b.id].consensus=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
    byLoc[b.id].votes=cnt;
  });

  const autores=Object.keys(byAutor).sort();
  const totalEval=BASE.filter(b=>byLoc[b.id].evals.length>0).length;
  const evalCounts={actuar:0,intentar:0,no:0,no_se:0};
  BASE.forEach(b=>{if(byLoc[b.id].consensus)evalCounts[byLoc[b.id].consensus]++;});

  const filteredEvals=filterAutor==='todos'?evals:evals.filter(e=>e.autor===filterAutor);

  let html=`
  <div class="kpi-row">
    <div class="kpi-box"><div class="kpi-val">${evals.length}</div><div class="kpi-lbl">Evaluaciones cargadas</div></div>
    <div class="kpi-box"><div class="kpi-val">${totalEval}/${BASE.length}</div><div class="kpi-lbl">Localidades evaluadas</div></div>
    <div class="kpi-box"><div class="kpi-val">${Object.keys(byAutor).length}</div><div class="kpi-lbl">Participantes</div></div>
    <div class="kpi-box"><div class="kpi-val">${vncs.length}</div><div class="kpi-lbl">Vínculos registrados</div></div>
  </div>
  <div class="kpi-row">
    <div class="kpi-box" style="border-top:3px solid #2e7d32"><div class="kpi-val" style="color:#2e7d32">${evalCounts.actuar}</div><div class="kpi-lbl">✅ Oportunidades</div></div>
    <div class="kpi-box" style="border-top:3px solid #e65100"><div class="kpi-val" style="color:#e65100">${evalCounts.intentar}</div><div class="kpi-lbl">🔄 Intentarlo</div></div>
    <div class="kpi-box" style="border-top:3px solid #c62828"><div class="kpi-val" style="color:#c62828">${evalCounts.no}</div><div class="kpi-lbl">🚫 No conviene</div></div>
    <div class="kpi-box" style="border-top:3px solid #888"><div class="kpi-val" style="color:#888">${evalCounts.no_se}</div><div class="kpi-lbl">🤷 Sin conocimiento</div></div>
  </div>

  <div class="filter-row">
    <span class="filter-label">Filtrar por persona:</span>
    <select class="filter-sel" onchange="filterAutor=this.value;render(window._evals,window._vncs)">
      <option value="todos">Todos</option>
      ${autores.map(a=>`<option value="${a}" ${filterAutor===a?'selected':''}>${a} (${byAutor[a]})</option>`).join('')}
    </select>
  </div>

  <div class="tab-row">
    <button class="tab-btn ${curView==='grid'?'active':''}" onclick="curView='grid';render(window._evals,window._vncs)">🗺 Vista localidades</button>
    <button class="tab-btn ${curView==='tabla'?'active':''}" onclick="curView='tabla';render(window._evals,window._vncs)">📋 Vista detalle</button>
  </div>`;

  if(curView==='grid'){
    html+=`<div class="legend">
      <span class="leg-item"><span class="leg-dot" style="background:#2e7d32"></span>Tenemos oportunidades</span>
      <span class="leg-item"><span class="leg-dot" style="background:#e65100"></span>Hay que intentarlo</span>
      <span class="leg-item"><span class="leg-dot" style="background:#c62828"></span>No conviene ahora</span>
      <span class="leg-item"><span class="leg-dot" style="background:#888"></span>Sin conocimiento</span>
      <span class="leg-item"><span class="leg-dot" style="background:#e0d8cc"></span>Sin evaluar</span>
    </div>
    <div class="loc-grid">`;

    const viewEvals=filterAutor==='todos'?null:filteredEvals;
    BASE.forEach(b=>{
      const ld=byLoc[b.id];
      let consensus=null;
      if(viewEvals){
        const mine=viewEvals.filter(e=>e.localidad_id===b.id);
        if(mine.length) consensus=mine[mine.length-1].evaluacion;
      } else {
        consensus=ld.consensus;
      }
      const def=consensus?EVAL_DEF[consensus]:null;
      const cls=consensus?`e-${consensus}`:'e-none';
      const vncCnt=ld.vncs.length;
      const authors=[...new Set(ld.evals.map(e=>e.autor))].join(', ');
      html+=`<div class="loc-card ${cls}">
        <div class="loc-name">${b.n}</div>
        <div class="loc-tipo">${b.G?'Municipio':'Comuna'}${vncCnt>0?` · ${vncCnt} vínculo${vncCnt>1?'s':''}`:''}
        </div>
        <div class="loc-eval ${cls}">${def?def.ico+' '+def.txt:'— Sin evaluar'}</div>
        ${authors?`<div class="loc-authors">${authors}</div>`:''}
      </div>`;
    });
    html+=`</div>`;
  } else {
    const rowsEvals=filterAutor==='todos'?evals:filteredEvals;
    html+=`<div class="section-title">Evaluaciones (${rowsEvals.length})</div>
    <div class="table-wrap"><table>
      <tr><th>Localidad</th><th>Evaluación</th><th>Persona</th><th>Fecha</th></tr>
      ${rowsEvals.map(e=>{
        const def=EVAL_DEF[e.evaluacion]||{ico:'?',txt:e.evaluacion};
        const ts=e.created_at?new Date(e.created_at).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
        return `<tr><td>${e.localidad_n||e.localidad_id}</td><td><span class="pill pill-${e.evaluacion}">${def.ico} ${def.txt}</span></td><td>${e.autor}</td><td>${ts}</td></tr>`;
      }).join('')}
    </table></div>`;
  }

  document.getElementById('main').innerHTML=html;
  window._evals=evals; window._vncs=vncs;
}

loadData();
</script>
</body>
</html>
