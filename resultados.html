<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados — PS Castellanos</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Barlow',Arial,sans-serif;background:#0e1420;color:#f0f0f0}
.hdr{background:linear-gradient(135deg,#8b0000,#c62828);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr-title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:.5px;text-transform:uppercase}
.hdr-sub{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.reload-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:8px 16px;font-size:12px;cursor:pointer;font-family:'Oswald',sans-serif;font-weight:600}
.reload-btn:hover{background:rgba(255,255,255,.25)}
.hdr-stripe{height:5px;background:repeating-linear-gradient(90deg,#8b0000 0,#8b0000 30px,#c62828 30px,#c62828 60px)}
.container{max-width:1280px;margin:0 auto;padding:22px 18px 60px}
/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi-box{background:#1a2234;border:1px solid #2a3349;border-radius:10px;padding:16px;text-align:center}
.kpi-val{font-family:'Oswald',sans-serif;font-size:36px;font-weight:700;line-height:1}
.kpi-lbl{font-size:10px;color:#8b97ab;margin-top:5px;text-transform:uppercase;letter-spacing:.6px}
.v-verde{color:#4ade80}.v-amar{color:#fbbf24}.v-rojo{color:#f87171}.v-azul{color:#60a5fa}.v-blanco{color:#fff}
/* Layout principal: mapa + panel */
.main-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}}
.map-panel{background:#141b2b;border:1px solid #2a3349;border-radius:12px;padding:16px;position:relative}
.map-title{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#aab4c5;margin-bottom:10px;text-align:center}
.map-wrap{position:relative;width:100%;max-width:620px;margin:0 auto;background:#0e1420;border-radius:8px}
#mapaBg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;opacity:0.22;pointer-events:none;z-index:0}
#mapSvg{position:relative;z-index:1;width:100%;height:auto;display:block}
.map-leg{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.ml-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#8b97ab}
.ml-dot{width:11px;height:11px;border-radius:50%}
/* Panel lateral */
.side-panel{display:flex;flex-direction:column;gap:16px}
.detail-box{background:#141b2b;border:1px solid #2a3349;border-radius:12px;padding:18px;min-height:120px}
.detail-empty{color:#6b7689;font-size:13px;text-align:center;padding:30px 10px;font-style:italic}
.detail-loc{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:#fff}
.detail-tipo{font-size:11px;color:#8b97ab;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.detail-eval{display:inline-block;font-size:14px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:14px}
.de-actuar{background:rgba(74,222,128,.15);color:#4ade80}
.de-intentar{background:rgba(251,191,36,.15);color:#fbbf24}
.de-no{background:rgba(248,113,113,.15);color:#f87171}
.de-nose{background:rgba(139,151,171,.15);color:#8b97ab}
.de-none{background:rgba(139,151,171,.1);color:#6b7689}
.detail-votos{font-size:12px;color:#8b97ab;margin-bottom:12px}
.vnc-sec-title{font-size:11px;color:#aab4c5;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px;font-weight:700;border-top:1px solid #2a3349;padding-top:12px}
.vnc-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #1f2738}
.vnc-row:last-child{border-bottom:none}
.vnc-ico{font-size:18px;flex-shrink:0}
.vnc-info{flex:1}
.vnc-nombre{font-weight:700;font-size:13px;color:#e8e8e8}
.vnc-cat{font-size:10px;color:#60a5fa;text-transform:uppercase;letter-spacing:.3px}
.vnc-det{font-size:12px;color:#99a3b5;margin-top:2px}
/* Semáforo resumen */
.semaforo{background:#141b2b;border:1px solid #2a3349;border-radius:12px;padding:16px}
.sem-title{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#aab4c5;margin-bottom:12px}
.sem-cat{margin-bottom:12px}
.sem-head{font-size:12px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sem-chips{display:flex;flex-wrap:wrap;gap:5px}
.sem-chip{font-size:12px;padding:4px 10px;border-radius:14px;cursor:pointer;font-weight:600;border:1px solid}
.chip-verde{background:rgba(74,222,128,.12);color:#4ade80;border-color:rgba(74,222,128,.3)}
.chip-amar{background:rgba(251,191,36,.12);color:#fbbf24;border-color:rgba(251,191,36,.3)}
.chip-rojo{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.3)}
.sem-chip:hover{filter:brightness(1.3)}
.loading{text-align:center;padding:50px;color:#6b7689;font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:1px}
.dot-pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="hdr-title">🌹 Mapa Territorial · PS Castellanos</div>
    <div class="hdr-sub" id="lastUpdate">Cargando...</div>
  </div>
  <button class="reload-btn" onclick="loadData()">↺ Actualizar</button>
</div>
<div class="hdr-stripe"></div>
<div class="container">
  <div id="main"><div class="loading">Cargando datos...</div></div>
</div>
<script>
const SUPA_URL="https://ikaadszatnbmzjrjvmkv.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrYWFkc3phdG5ibXpqcmp2bWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mjc1ODMsImV4cCI6MjA5NzEwMzU4M30.QS4ClCaryH56pGAVc4ICS_eHC1LZmvQFrR4KNri3GSs";

const PXMAP =   {    rafaela:[442.8,468.0], sunchales:[438.0,218.4], frontera:[69.2,698.4],    san_vicente:[448.8,922.0], humberto:[604.8,137.2], maria_juana:[298.4,906.8],    susana:[481.6,605.6], col_aldao:[298.8,250.4], angelica:[463.2,776.0],    ataliva:[545.2,272.8], aurelia:[560.0,662.0], bauer_sigel:[136.8,537.2],    bella_italia:[562.0,529.6], col_bicha:[215.2,130.4], col_bigand:[318.4,345.6],    castellanos_c:[304.4,455.2], col_cello:[224.4,672.0], col_iturraspe:[406.0,716.0],    col_margarita:[374.0,904.0], col_raquel:[494.4,121.6], coronel_fraga:[152.8,432.0],    plaza_cluc:[333.2,688.8], egusquiza:[396.8,363.2], esmeralda:[156.0,849.2],    est_cluc:[320.4,760.4], eusebia:[207.2,222.0], eustolia:[276.0,807.6],    fidela:[256.0,332.4], galisteo:[611.6,303.2], garibaldi:[244.4,886.4],    hugentobler:[288.4,190.8], josefina:[110.4,645.6], lehmann:[526.0,386.0],    maua:[676.0,51.6], pte_roca:[400.0,472.0], pueblo_marini:[182.0,305.6],    ramona:[170.4,366.4], saguier:[348.8,571.6], san_antonio:[302.0,473.2],    sta_clara:[243.2,591.2], tacural:[411.6,123.2], tacurales:[288.0,112.0],    vila:[230.8,448.8], villa_san_jose:[398.0,582.0], virginia:[614.4,27.2],    zenon_pereyra:[178.0,799.2]  };

const BASE=[
  {id:"rafaela",n:"Rafaela"},{id:"sunchales",n:"Sunchales"},{id:"frontera",n:"Frontera"},{id:"san_vicente",n:"San Vicente"},{id:"humberto",n:"Humberto Primo"},{id:"maria_juana",n:"Maria Juana"},{id:"col_aldao",n:"Colonia Aldao"},{id:"angelica",n:"Angelica"},{id:"ataliva",n:"Ataliva"},{id:"aurelia",n:"Aurelia"},{id:"bauer_sigel",n:"Bauer y Sigel"},{id:"bella_italia",n:"Bella Italia"},{id:"col_bicha",n:"Col. Bicha"},{id:"col_bigand",n:"Col. Bigand"},{id:"castellanos_c",n:"Castellanos"},{id:"col_cello",n:"Colonia Cello"},{id:"col_iturraspe",n:"Col. Iturraspe"},{id:"col_margarita",n:"Col. Margarita"},{id:"maua",n:"Maua"},{id:"col_raquel",n:"Colonia Raquel"},{id:"coronel_fraga",n:"Coronel Fraga"},{id:"plaza_cluc",n:"Plaza Clucellas"},{id:"egusquiza",n:"Egusquiza"},{id:"esmeralda",n:"Esmeralda"},{id:"est_cluc",n:"Est. Clucellas"},{id:"eusebia",n:"Eusebia y Carolina"},{id:"eustolia",n:"Eustolia"},{id:"fidela",n:"Fidela"},{id:"galisteo",n:"Galisteo"},{id:"garibaldi",n:"Garibaldi"},{id:"hugentobler",n:"Hugentobler"},{id:"josefina",n:"Josefina"},{id:"lehmann",n:"Lehmann"},{id:"pte_roca",n:"Presidente Roca"},{id:"pueblo_marini",n:"Pueblo Marini"},{id:"ramona",n:"Ramona"},{id:"saguier",n:"Saguier"},{id:"san_antonio",n:"San Antonio"},{id:"sta_clara",n:"Sta. Clara de Saguier"},{id:"susana",n:"Susana"},{id:"tacural",n:"Tacural"},{id:"tacurales",n:"Tacurales"},{id:"vila",n:"Vila"},{id:"villa_san_jose",n:"Villa San Jose"},{id:"virginia",n:"Virginia"},{id:"zenon_pereyra",n:"Zenon Pereyra"}
];
const EVAL_DEF={
  actuar:{ico:'✅',txt:'Tenemos oportunidades',col:'#4ade80',cls:'actuar'},
  intentar:{ico:'🔄',txt:'Hay que intentarlo',col:'#fbbf24',cls:'intentar'},
  no:{ico:'🚫',txt:'Hay que profundizar',col:'#f87171',cls:'no'},
  no_se:{ico:'🤷',txt:'Sin lectura aún',col:'#8b97ab',cls:'nose'}
};
const TIPO_VNC={
  escuela:{ico:'🎓',name:'Educación'},club:{ico:'⚽',name:'Deportivo'},
  iglesia:{ico:'⛪',name:'Comunitario'},institucion:{ico:'🏛',name:'Institucional'},
  comercio:{ico:'🏪',name:'Comercial'},cultural:{ico:'🎭',name:'Cultural'},
  persona:{ico:'👤',name:'Referente'},otro:{ico:'📌',name:'Otro'}
};

let DATA={byLoc:{}, evals:[], vncs:[]};

async function supa(path){
  const r=await fetch(SUPA_URL+"/rest/v1/"+path,{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}});
  return r.json();
}

// Consenso: evaluación dominante SIN contar no_se
function consenso(evals){
  const c={actuar:0,intentar:0,no:0};
  evals.forEach(e=>{ if(e.evaluacion!=='no_se') c[e.evaluacion]=(c[e.evaluacion]||0)+1; });
  const tot=c.actuar+c.intentar+c.no;
  if(tot===0) return {tipo:null,c,tot};
  // prioridad: actuar > intentar > no (el que más votos tiene)
  let max='actuar',mv=c.actuar;
  if(c.intentar>mv){max='intentar';mv=c.intentar;}
  if(c.no>mv){max='no';mv=c.no;}
  return {tipo:max,c,tot};
}

async function loadData(){
  document.getElementById('lastUpdate').textContent='Actualizando...';
  const [evals,vncs]=await Promise.all([
    supa('evaluaciones?select=localidad_id,localidad_n,evaluacion,autor'),
    supa('vinculos?select=localidad,localidad_n,nombre,tipo,vinculo,oportunidad')
  ]);
  const vncsClean=(vncs||[]).filter(v=>v.nombre!=='PRUEBA_DIAGNOSTICO_BORRAR');
  const byLoc={};
  BASE.forEach(b=>byLoc[b.id]={evals:[],vncs:[],cons:null});
  evals.forEach(e=>{ if(byLoc[e.localidad_id]) byLoc[e.localidad_id].evals.push(e); });
  vncsClean.forEach(v=>{ if(byLoc[v.localidad]) byLoc[v.localidad].vncs.push(v); });
  BASE.forEach(b=>{ byLoc[b.id].cons=consenso(byLoc[b.id].evals); });
  DATA={byLoc,evals,vncs:vncsClean};
  const now=new Date().toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  const utiles=evals.filter(e=>e.evaluacion!=='no_se').length;
  const participantes=new Set(evals.map(e=>e.autor)).size;
  document.getElementById('lastUpdate').textContent=utiles+' opiniones · '+participantes+' participantes · '+vncsClean.length+' vínculos · '+now;
  render();
}

function render(){
  const {byLoc,evals,vncs}=DATA;
  const utiles=evals.filter(e=>e.evaluacion!=='no_se');
  const participantes=new Set(evals.map(e=>e.autor)).size;
  const locConSenal=BASE.filter(b=>byLoc[b.id].cons.tipo).length;

  // categorías semáforo
  const prio=[],expl=[],prof=[];
  BASE.forEach(b=>{
    const c=byLoc[b.id].cons; if(!c.tipo) return;
    if(c.tipo==='actuar') prio.push(b);
    else if(c.tipo==='intentar') expl.push(b);
    else if(c.tipo==='no') prof.push(b);
  });

  let html=`
  <div class="kpi-row">
    <div class="kpi-box"><div class="kpi-val v-verde">${prio.length}</div><div class="kpi-lbl">Con oportunidad</div></div>
    <div class="kpi-box"><div class="kpi-val v-amar">${expl.length}</div><div class="kpi-lbl">A explorar</div></div>
    <div class="kpi-box"><div class="kpi-val v-blanco">${utiles.length}</div><div class="kpi-lbl">Opiniones</div></div>
    <div class="kpi-box"><div class="kpi-val v-azul">${participantes}</div><div class="kpi-lbl">Participantes</div></div>
    <div class="kpi-box"><div class="kpi-val v-blanco">${vncs.length}</div><div class="kpi-lbl">Vínculos</div></div>
  </div>
  <div class="main-grid">
    <div class="map-panel">
      <div class="map-title">Departamento Castellanos · Mirada del equipo</div>
      <div class="map-wrap" id="mapWrap">
        <img id="mapaBg" src="mapa_castellanos.png" alt="Mapa" onerror="this.style.display='none'">
        <svg id="mapSvg" viewBox="0 0 775 1004" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="map-leg">
        <span class="ml-item"><span class="ml-dot" style="background:#4ade80"></span>Oportunidad</span>
        <span class="ml-item"><span class="ml-dot" style="background:#fbbf24"></span>Intentar</span>
        <span class="ml-item"><span class="ml-dot" style="background:#f87171"></span>Profundizar</span>
        <span class="ml-item"><span class="ml-dot" style="background:#3a4257"></span>Sin datos</span>
      </div>
    </div>
    <div class="side-panel">
      <div class="detail-box" id="detailBox">
        <div class="detail-empty">👆 Tocá una localidad en el mapa para ver su detalle</div>
      </div>
      <div class="semaforo">
        <div class="sem-title">Mapa de decisión</div>
        <div class="sem-cat"><div class="sem-head" style="color:#4ade80">🟢 Prioridad — con oportunidad (${prio.length})</div><div class="sem-chips">${prio.map(b=>'<span class="sem-chip chip-verde" onclick="showDetail(\''+b.id+'\')">'+b.n+'</span>').join('')||'<span style="color:#6b7689;font-size:12px">—</span>'}</div></div>
        <div class="sem-cat"><div class="sem-head" style="color:#fbbf24">🟡 Explorar — a profundizar (${expl.length})</div><div class="sem-chips">${expl.map(b=>'<span class="sem-chip chip-amar" onclick="showDetail(\''+b.id+'\')">'+b.n+'</span>').join('')||'<span style="color:#6b7689;font-size:12px">—</span>'}</div></div>
        ${prof.length?'<div class="sem-cat"><div class="sem-head" style="color:#f87171">🔴 Requieren más análisis ('+prof.length+')</div><div class="sem-chips">'+prof.map(b=>'<span class="sem-chip chip-rojo" onclick="showDetail(\''+b.id+'\')">'+b.n+'</span>').join('')+'</div></div>':''}
      </div>
    </div>
  </div>`;
  document.getElementById('main').innerHTML=html;
  drawMap();
}

function drawMap(){
  const svg=document.getElementById('mapSvg');
  if(!svg) return;
  const {byLoc}=DATA;
  let s='';
  BASE.forEach(b=>{
    const p=PXMAP[b.id]; if(!p) return;
    const c=byLoc[b.id].cons;
    const col = c.tipo?EVAL_DEF[c.tipo].col:'#3a4257';
    const r = c.tipo? (8+Math.min(c.tot,5)*2) : 6;
    const pulse = c.tipo==='actuar'?' class="dot-pulse"':'';
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="'+col+'" fill-opacity="0.9" stroke="#0e1420" stroke-width="1.5" style="cursor:pointer"'+pulse+' onclick="showDetail(\''+b.id+'\')"><title>'+b.n+'</title></circle>';
  });
  svg.innerHTML=s;
}

function showDetail(id){
  const b=BASE.find(x=>x.id===id); if(!b) return;
  const ld=DATA.byLoc[id];
  const c=ld.cons;
  const box=document.getElementById('detailBox');
  let evalHTML='';
  if(c.tipo){
    const d=EVAL_DEF[c.tipo];
    evalHTML='<div class="detail-eval de-'+d.cls+'">'+d.ico+' '+d.txt+'</div>';
    const partes=[];
    if(c.c.actuar)partes.push(c.c.actuar+' oportunidad');
    if(c.c.intentar)partes.push(c.c.intentar+' intentar');
    if(c.c.no)partes.push(c.c.no+' profundizar');
    evalHTML+='<div class="detail-votos">'+partes.join(' · ')+'</div>';
  } else {
    evalHTML='<div class="detail-eval de-none">Sin lectura consolidada aún</div>';
  }
  // vínculos agrupados por tipo
  let vncHTML='';
  if(ld.vncs.length){
    vncHTML='<div class="vnc-sec-title">Vínculos relevados ('+ld.vncs.length+')</div>';
    ld.vncs.forEach(v=>{
      const td=TIPO_VNC[v.tipo]||{ico:'📌',name:v.tipo};
      vncHTML+='<div class="vnc-row"><span class="vnc-ico">'+td.ico+'</span><div class="vnc-info"><div class="vnc-nombre">'+v.nombre+'</div><div class="vnc-cat">'+td.name+'</div>'+(v.vinculo?'<div class="vnc-det">'+v.vinculo+'</div>':'')+(v.oportunidad?'<div class="vnc-det" style="color:#4ade80">💡 '+v.oportunidad+'</div>':'')+'</div></div>';
    });
  } else {
    vncHTML='<div class="vnc-sec-title">Vínculos</div><div style="font-size:12px;color:#6b7689;font-style:italic">Sin contactos cargados todavía</div>';
  }
  box.innerHTML='<div class="detail-loc">'+b.n+'</div><div class="detail-tipo">Departamento Castellanos</div>'+evalHTML+vncHTML;
}
loadData();
</script>
</body>
</html>
