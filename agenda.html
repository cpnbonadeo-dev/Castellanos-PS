<head>
<meta charset="UTF-8">

<style>
:root{--bg:#0a0f1e;--card:#111827;--border:#1e2d45;--red:#e63946;--gold:#f59e0b;--blue:#3b82f6;--green:#22c55e;--purple:#a855f7;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* NAV */
nav{background:var(--red);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:10px;flex-wrap:wrap}
.nav-brand{font-family:'Bebas Neue',sans-serif;font-size:20px;color:white;letter-spacing:2px;white-space:nowrap;text-decoration:none}
.nav-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav-links a{color:rgba(255,255,255,.9);text-decoration:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:6px;transition:all .15s;white-space:nowrap}
.nav-links a:hover{background:rgba(255,255,255,.15)}
.nav-links a.active{background:#fff;color:var(--red);font-weight:700}
.nav-links a.nav-hero{background:rgba(255,255,255,.18);font-size:15px;font-weight:700;padding:10px 20px;border-radius:8px}
.nav-links a.nav-hero.active{background:#fff;color:var(--red)}
.nav-links a.nav-panel-link{background:rgba(0,0,0,.22);color:rgba(255,255,255,.85);font-size:12px;border:1px solid rgba(255,255,255,.25)}
@media(max-width:580px){
  nav{padding:8px 12px}
  .nav-brand{font-size:17px;width:100%;margin-bottom:4px}
  .nav-links{width:100%;gap:5px}
  .nav-links a{font-size:11px;padding:5px 8px;flex:1;text-align:center}
}

/* HERO */
.hero{background:linear-gradient(135deg,#0a0f1e 0%,#0d1a2e 60%,#111827 100%);padding:28px 20px 20px;border-bottom:1px solid var(--border)}
.hero-inner{max-width:1140px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:4px;color:#fff;line-height:1}
.hero-sub{font-size:13px;color:var(--muted);margin-top:4px}
.hero-credit{margin-top:8px;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.hero-credit span{font-weight:400;color:#94a3b8}
.year-badge{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--gold);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);padding:6px 14px;border-radius:20px;white-space:nowrap}

/* CONTROLES */
.controls{max-width:1140px;margin:20px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:12px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{font-size:11px;font-weight:700;letter-spacing:.8px;padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;text-transform:uppercase;white-space:nowrap}
.filter-btn:hover{border-color:#2a3a5a;color:#fff}
.filter-btn.on{background:var(--red);border-color:var(--red);color:#fff}
.filter-btn.ps-loc{border-color:rgba(245,158,11,.3);color:var(--gold)}
.filter-btn.ps-loc.on{background:var(--gold);border-color:var(--gold);color:#000}
.tipo-row{display:flex;gap:6px;flex-wrap:wrap}
.tipo-btn{font-size:10px;font-weight:700;letter-spacing:.5px;padding:4px 10px;border-radius:10px;border:none;cursor:pointer;transition:all .15s;text-transform:uppercase}
.tipo-btn.on{opacity:1}
.tipo-btn:not(.on){opacity:.4}
@media(max-width:700px){
  .filter-row,.tipo-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filter-row::-webkit-scrollbar,.tipo-row::-webkit-scrollbar{display:none}
}

/* LAYOUT */
.main{max-width:1140px;margin:24px auto 80px;padding:0 20px}

/* MESES */
.mes-bloque{margin-bottom:32px}
.mes-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer;user-select:none}
.mes-nombre{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:#fff;line-height:1}
.mes-count{font-size:11px;font-weight:700;color:var(--muted);background:#1e2d45;padding:3px 10px;border-radius:10px}
.mes-toggle{font-size:14px;color:var(--muted);margin-left:auto;transition:transform .2s}
.mes-toggle.closed{transform:rotate(-90deg)}
.mes-line{flex:1;height:1px;background:var(--border)}
.mes-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.mes-body.hidden{display:none}
@media(max-width:480px){.mes-body{grid-template-columns:1fr}}

/* EVENTO CARD */
.ev{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:border-color .2s,transform .15s;position:relative;overflow:hidden}
.ev:hover{border-color:#2a3a5a;transform:translateY(-1px)}
.ev::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px}
.ev[data-tipo="patronal"]::before{background:#f59e0b}
.ev[data-tipo="cultural"]::before{background:#a855f7}
.ev[data-tipo="deportivo"]::before{background:#3b82f6}
.ev[data-tipo="politico"]::before{background:#e63946}
.ev[data-tipo="social"]::before{background:#22c55e}
.ev[data-tipo="feria"]::before{background:#f97316}
.ev[data-tipo="educativo"]::before{background:#ec4899}

/* FECHA COLUMNA */
.ev-fecha{min-width:42px;text-align:center;flex-shrink:0}
.ev-dia{font-family:'Bebas Neue',sans-serif;font-size:30px;color:#fff;line-height:1}
.ev-mes-mini{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}

/* INFO */
.ev-info{flex:1;min-width:0}
.ev-loc{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.ev-title{font-size:13px;font-weight:700;color:#fff;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev-link-ico{font-size:11px;color:var(--muted);margin-top:5px}

/* TIPO DOTS */
.tipo-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:#111827;border:1px solid #1e2d45;border-radius:14px;max-width:480px;width:100%;padding:24px;position:relative;max-height:90vh;overflow-y:auto}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.modal-close:hover{color:#fff}
.modal-tipo{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.modal-title{font-size:20px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:10px}
.modal-fecha{font-size:13px;color:var(--muted);margin-bottom:8px}
.modal-loc{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:10px;margin-bottom:14px}
.modal-desc{font-size:13px;color:#94a3b8;line-height:1.6;margin-bottom:16px}
.modal-cta{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:10px 20px;border-radius:8px;transition:background .15s}
.modal-cta:hover{background:#c1121f}

/* EMPTY */
.ag-empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:20px;text-align:center;font-size:12px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
</style>
</head>

// ══ PARSER DEL GOOGLE DOC ══
const MMAP={'ENERO':'01','FEBRERO':'02','MARZO':'03','ABRIL':'04','MAYO':'05','JUNIO':'06',
            'JULIO':'07','AGOSTO':'08','SEPTIEMBRE':'09','OCTUBRE':'10','NOVIEMBRE':'11','DICIEMBRE':'12'};
const MABR=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const LOC_KW=[
  ['Sunchales',['sunchales']],['Rafaela',['rafaela']],['Col. Margarita',['margarita']],
  ['Colonia Raquel',['raquel']],['Eusebia',['eusebia']],['Maúa',['maua','maúa']],
  ['Zenón Pereyra',['zenon','zenón']],['Colonia Aldao',['aldao']],
  ['Col. Iturraspe',['iturraspe']],['Garibaldi',['garibaldi']],
  ['Frontera',['frontera']],['San Vicente',['san vicente']],
  ['María Juana',['m juana','maria juana','m.juana']],['Humberto Primo',['humberto']],
  ['Susana',['susana']],['Ataliva',['ataliva']],['Bella Italia',['bella italia']],
  ['Angélica',['angelica','angélica']],['Ramona',['ramona']],['Saguier',['saguier']],
  ['Pte. Roca',['pte roca','presidente roca']],['Josefina',['josefina']],
  ['Tacural',['tacural']],['Esmeralda',['esmeralda']],['Est. Clucellas',['clucellas','clucel']],
  ['Eustolia',['eustolia']],['Col. Cello',['cello']],['Galisteo',['galisteo']],
  ['Fidela',['fidela']],['Tacurales',['tacurales']],['Aurelia',['aurelia']],
  ['Col. Bicha',['bicha']],['Hugentobler',['hughen','hugen']],
  ['San Antonio',['san antonio']],['Coronel Fraga',['fraga']],
  ['Castellanos',['castellanos']],
];

const TIPO_KW={
  patronal:['aniversario','patronal','patronales','festejo','fiesta pcial','fiesta patria','fiesta provincia'],
  cultural:['teatro','tango','ted','bagna','coplas','karma','concierto','cultural','orquesta','carnaval','bingo','jinetes'],
  deportivo:['padel','futbol','fútbol','rally','maratón','olimpiadas','leoncito','ciclismo','desafio','desafío','finaco','atletismo'],
  social:['cena','almuerzo','rotary','reunión','reunio','encuentro','celebra'],
  feria:['expo','feria','muestra','seminario','artesanos'],
  educativo:['escuela','colegio','educativo'],
  politico:['licitación','licitacion','aprobación','hospital','traza','lanzamiento'],
};

function guessLoc(txt){
  const low=txt.toLowerCase();
  for(const[loc,kws]of LOC_KW) if(kws.some(k=>low.includes(k))) return loc;
  return 'Departamento';
}
function guessTipo(txt){
  const low=txt.toLowerCase();
  for(const[t,kws]of Object.entries(TIPO_KW)) if(kws.some(k=>low.includes(k))) return t;
  return 'patronal';
}
function cleanTitle(t){
  return t.replace(/\s+/g,' ').replace(/^[-–,\s]+/,'').replace(/[-–,\s]+$/,'').trim();
}

function parseDocText(raw){
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const evs=[];
  let year='2026', month='';
  for(const line of lines){
    const up=line.toUpperCase();
    if(/^\d{4}$/.test(line)){year=line;continue;}
    if(MMAP[up]){month=MMAP[up];continue;}
    if(!month||!/^\d/.test(line)) continue;
    // Extract URL
    const urlM=line.match(/https?:\/\/\S+/);
    const url=urlM?urlM[0].replace(/[,.)]+$/,''):'';
    let rest=line.replace(url,'').replace(/\s+/g,' ').trim();
    // Extract date(s)
    const dM=rest.match(/^(\d{1,2})\s*(?:[AaYy][Ll]?\s+)?(\d{1,2})?\s/);
    if(!dM) continue;
    const d1=dM[1].padStart(2,'0');
    const d2=dM[2]?dM[2].padStart(2,'0'):null;
    rest=rest.slice(dM[0].length).trim();
    const mNum=parseInt(month);
    const fd=d2?`${+d1}–${+d2} ${MABR[mNum]}`:`${+d1} ${MABR[mNum]}`;
    const f=`${year}-${month}-${d1}`;
    const dest=/DESTACADO/i.test(rest);
    const title=cleanTitle(rest.replace(/DESTACADO/gi,''));
    const loc=guessLoc(title);
    const tipo=guessTipo(title);
    const ev={f,fd,t:title,u:url,loc,tipo};
    if(dest) ev.dest=true;
    evs.push(ev);
  }
  return evs.sort((a,b)=>a.f.localeCompare(b.f));
}

// ══ CARGA DE DATOS (doc en vivo o fallback) ══
let AGENDA=AGENDA_FALLBACK;

async function loadAgenda(){
  if(!SCRIPT_URL){renderWithIndex();return;}
  document.getElementById('main').innerHTML='<div class="ag-empty" style="padding:60px">⏳ Cargando agenda…</div>';
  try{
    const r=await fetch(SCRIPT_URL);
    const j=await r.json();
    if(j.ok && j.text){
      const parsed=parseDocText(j.text);
      if(parsed.length>0){
        AGENDA=parsed;
        // Actualizar badge
        const badge=document.querySelector('.year-badge');
        if(badge) badge.title='Actualizado: '+new Date(j.ts).toLocaleString('es-AR');
      }
    }
  }catch(e){console.warn('Agenda: usando datos locales',e);}
  renderWithIndex();
}

// ══ COLORES POR TIPO ══
const TIPO_COLOR={patronal:'#f59e0b',cultural:'#a855f7',deportivo:'#3b82f6',social:'#22c55e',feria:'#f97316',educativo:'#ec4899',politico:'#e63946'};
const TIPO_LBL={patronal:'Patronal',cultural:'Cultural',deportivo:'Deportivo',social:'Social',feria:'Feria',educativo:'Educativo',politico:'Político'};

// ══ LOCALIDADES PS (filtro dorado) ══
const PS_LOCS_SET=new Set(['Sunchales','Rafaela','Col. Margarita','Colonia Raquel','Eusebia','Maúa','Zenón Pereyra','Colonia Aldao','Col. Iturraspe','Garibaldi']);

// ══ MESES ══
const MESES_FULL=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function mesKey(f){return f.slice(0,7);}
function mesFull(k){const[y,m]=k.split('-');return MESES_FULL[+m].toUpperCase()+' '+y;}
function diaNum(f){return f.split('-')[2].replace(/^0/,'');}

// ══ ESTADO FILTROS ══
let filtroLoc='todos';
let filtroTipo='todos'; // single-select

function matchEvent(ev){
  const tipoOk = filtroTipo==='todos' || ev.tipo===filtroTipo;
  if(filtroLoc==='todos') return tipoOk;
  if(filtroLoc==='otros') return !PS_LOCS_SET.has(ev.loc) && tipoOk;
  return ev.loc===filtroLoc && tipoOk;
}

// ══ RENDER ══
function render(){
  const main=document.getElementById('main');
  const visible=AGENDA.filter(matchEvent);
  if(!visible.length){main.innerHTML='<div class="ag-empty">No hay eventos para este filtro.</div>';return;}

  // Agrupar por mes
  const porMes={};
  visible.forEach(ev=>{const k=mesKey(ev.f);if(!porMes[k])porMes[k]=[];porMes[k].push(ev);});

  main.innerHTML=Object.keys(porMes).sort().map(k=>{
    const evs=porMes[k];
    return `<div class="mes-bloque">
      <div class="mes-header" data-mes="${k}">
        <div class="mes-nombre">${mesFull(k)}</div>
        <span class="mes-count">${evs.length} evento${evs.length!==1?'s':''}</span>
        <div class="mes-line"></div>
        <span class="mes-toggle">▼</span>
      </div>
      <div class="mes-body" id="mes-${k}">
        ${evs.map(ev=>evCard(ev)).join('')}
      </div>
    </div>`;
  }).join('');

  // Click en card → modal
  document.querySelectorAll('.ev').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx=+el.dataset.idx;
      openModal(AGENDA.filter(matchEvent)[idx]);
    });
  });

  // Toggle mes
  document.querySelectorAll('.mes-header').forEach(h=>{
    h.addEventListener('click',()=>{
      const body=document.getElementById('mes-'+h.dataset.mes);
      const tog=h.querySelector('.mes-toggle');
      body.classList.toggle('hidden');
      tog.classList.toggle('closed');
    });
  });
}

function evCard(ev,idx){
  const col=TIPO_COLOR[ev.tipo]||'#64748b';
  const dia=diaNum(ev.f);
  const mesAbr=MESES_FULL[+ev.f.split('-')[1]].slice(0,3);
  const psTag=PS_LOCS_SET.has(ev.loc)?`<span style="color:var(--gold);font-size:9px;margin-left:4px">🌹</span>`:'';
  return `<div class="ev" data-tipo="${ev.tipo}" data-idx="${idx||0}">
    <div class="ev-fecha">
      <div class="ev-dia">${dia}</div>
      <div class="ev-mes-mini">${mesAbr}</div>
    </div>
    <div class="ev-info">
      <div class="ev-loc" style="color:${col}">${ev.loc}${psTag}</div>
      <div class="ev-title">${ev.t}</div>
      ${ev.u?'<div class="ev-link-ico">🔗 ver más</div>':''}
    </div>
    <div class="tipo-dot" style="background:${col}"></div>
  </div>`;
}

// Reindex after filter
function renderWithIndex(){
  const main=document.getElementById('main');
  const visible=AGENDA.filter(matchEvent);
  if(!visible.length){main.innerHTML='<div class="ag-empty">No hay eventos para este filtro.</div>';return;}
  const porMes={};
  const idxMap=[];
  visible.forEach((ev,i)=>{const k=mesKey(ev.f);if(!porMes[k])porMes[k]=[];porMes[k].push({ev,gi:i});});
  main.innerHTML=Object.keys(porMes).sort().map(k=>{
    const evs=porMes[k];
    return `<div class="mes-bloque">
      <div class="mes-header" data-mes="${k}">
        <div class="mes-nombre">${mesFull(k)}</div>
        <span class="mes-count">${evs.length} evento${evs.length!==1?'s':''}</span>
        <div class="mes-line"></div>
        <span class="mes-toggle">▼</span>
      </div>
      <div class="mes-body" id="mes-${k}">
        ${evs.map(({ev,gi})=>evCard(ev,gi)).join('')}
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.ev').forEach(el=>{
    el.addEventListener('click',()=>{openModal(visible[+el.dataset.idx]);});
  });
  document.querySelectorAll('.mes-header').forEach(h=>{
    h.addEventListener('click',()=>{
      const body=document.getElementById('mes-'+h.dataset.mes);
      const tog=h.querySelector('.mes-toggle');
      body.classList.toggle('hidden');
      tog.classList.toggle('closed');
    });
  });
}

// ══ MODAL ══
function openModal(ev){
  const col=TIPO_COLOR[ev.tipo]||'#64748b';
  document.getElementById('mTipo').textContent=TIPO_LBL[ev.tipo]||ev.tipo;
  document.getElementById('mTipo').style.color=col;
  document.getElementById('mTitle').textContent=ev.t;
  document.getElementById('mFecha').textContent='📅 '+ev.fd;
  const locEl=document.getElementById('mLoc');
  locEl.textContent=ev.loc;
  locEl.style.background=col+'22';
  locEl.style.color=col;
  locEl.style.border='1px solid '+col+'44';
  document.getElementById('mDesc').textContent=ev.d||'';
  document.getElementById('mDesc').style.display=ev.d?'':'none';
  document.getElementById('mCta').innerHTML=ev.u
    ?`<a class="modal-cta" href="${ev.u}" target="_blank" rel="noopener">Ver más →</a>` :'';
  document.getElementById('modalBg').classList.add('open');
}
document.getElementById('modalClose').addEventListener('click',()=>{document.getElementById('modalBg').classList.remove('open');});
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target===document.getElementById('modalBg'))document.getElementById('modalBg').classList.remove('open');});

// ══ FILTROS LOCALIDAD ══
document.querySelectorAll('#locBtns .filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    filtroLoc=b.dataset.loc;
    document.querySelectorAll('#locBtns .filter-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    renderWithIndex();
  });
});

// ══ FILTROS TIPO (single-select) ══
document.querySelectorAll('#tipoBtns .tipo-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    filtroTipo=b.dataset.t;
    document.querySelectorAll('#tipoBtns .tipo-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    renderWithIndex();
  });
});

loadAgenda();
</script>
