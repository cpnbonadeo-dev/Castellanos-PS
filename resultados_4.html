  evals.forEach(e=>{ if(e.evaluacion!=='no_se') c[e.evaluacion]=(c[e.evaluacion]||0)+1; });
  const tot=c.actuar+c.intentar+c.no;
  if(tot===0) return {tipo:null,c,tot};
  let max='actuar',mv=c.actuar;
  if(c.intentar>mv){max='intentar';mv=c.intentar;}
  if(c.no>mv){max='no';mv=c.no;}
  return {tipo:max,c,tot};
}
function incidencia(pct){
  if(pct>=40) return {lbl:'Alta',cls:'inc-alta'};
  if(pct>=20) return {lbl:'Media',cls:'inc-media'};
  if(pct>0) return {lbl:'Baja',cls:'inc-baja'};
  return {lbl:'—',cls:'inc-cero'};
}

async function loadData(){
  document.getElementById('lastUpdate').textContent='Actualizando...';
  const [evals,vncs]=await Promise.all([
    supa('evaluaciones?select=localidad_id,localidad_n,evaluacion,autor'),
    supa('vinculos?select=localidad,localidad_n,nombre,tipo,vinculo,oportunidad')
  ]);
  const vncsClean=(vncs||[]).filter(v=>v.nombre!=='PRUEBA_DIAGNOSTICO_BORRAR');
  const byLoc={};
  BASEDATA.forEach(b=>byLoc[b.id]={evals:[],vncs:[],cons:null});
  evals.forEach(e=>{ if(byLoc[e.localidad_id]) byLoc[e.localidad_id].evals.push(e); });
  vncsClean.forEach(v=>{ if(byLoc[v.localidad]) byLoc[v.localidad].vncs.push(v); });
  BASEDATA.forEach(b=>{ byLoc[b.id].cons=consenso(byLoc[b.id].evals); });
  DATA={byLoc,evals,vncs:vncsClean};
  const now=new Date().toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  const utiles=evals.filter(e=>e.evaluacion!=='no_se').length;
  const participantes=new Set(evals.map(e=>e.autor)).size;
  document.getElementById('lastUpdate').textContent=utiles+' opiniones · '+participantes+' participantes · '+vncsClean.length+' vínculos · '+now;
  render();
}

function render(){
  const {byLoc,evals,vncs}=DATA;
  const utiles=evals.filter(e=>e.evaluacion!=='no_se');
  const participantes=new Set(evals.map(e=>e.autor)).size;
  const trabajar=[],avanzar=[],noprio=[],faltan=[];
  BASEDATA.forEach(b=>{
    const c=byLoc[b.id].cons;
    if(!c.tipo) faltan.push(b);
    else if(c.tipo==='actuar') trabajar.push(b);
    else if(c.tipo==='intentar') avanzar.push(b);
    else if(c.tipo==='no') noprio.push(b);
  });
  const grupo=(titulo,sub,arr,cls,icon)=>{
    const chips=arr.length?arr.map(b=>{
      const nv=byLoc[b.id].vncs.length;
      return '<span class="g-chip '+cls+'" onclick="showFicha(\''+b.id+'\')">'+b.n+(nv>0?' <span class="g-vnc">'+nv+'🔗</span>':'')+'</span>';
    }).join(''):'<span class="g-empty">—</span>';
    return '<div class="grupo '+cls+'"><div class="g-head"><span class="g-icon">'+icon+'</span><span class="g-titulo">'+titulo+'</span><span class="g-count">'+arr.length+'</span></div><div class="g-sub">'+sub+'</div><div class="g-chips">'+chips+'</div></div>';
  };
  let html=`
  <div class="kpi-row">
    <div class="kpi-box"><div class="kpi-val v-verde">${trabajar.length}</div><div class="kpi-lbl">Donde trabajar</div></div>
    <div class="kpi-box"><div class="kpi-val v-amar">${avanzar.length}</div><div class="kpi-lbl">Podemos avanzar</div></div>
    <div class="kpi-box"><div class="kpi-val v-azul">${participantes}</div><div class="kpi-lbl">Participantes</div></div>
    <div class="kpi-box"><div class="kpi-val v-blanco">${vncs.length}</div><div class="kpi-lbl">Vínculos</div></div>
  </div>
  <div class="sec-label">① Mapa de decisión</div>
  <div class="grupos-wrap">
    ${grupo('Donde vamos a trabajar','Consenso: hay oportunidad',trabajar,'g-verde','🟢')}
    ${grupo('Donde podemos avanzar','Señal positiva, vale el intento',avanzar,'g-amar','🟡')}
    ${grupo('Por ahora no priorizamos','Sin oportunidad clara',noprio,'g-rojo','🔴')}
    ${grupo('Faltan relevar','Necesitamos más miradas',faltan,'g-gris','⚪')}
  </div>
  <div class="sec-label">② Ficha de la localidad</div>
  <div class="ficha" id="fichaBox"><div class="ficha-empty">👆 Tocá una localidad (arriba o en el mapa) para ver su ficha completa</div></div>
  <div class="sec-label">③ El territorio (respaldo visual)</div>
  <div class="map-panel">
    <div class="map-wrap" id="mapWrap">
      <img id="mapaBg" src="mapa_castellanos.png" alt="Mapa" onerror="this.style.display='none'">
      <svg id="mapSvg" viewBox="0 0 775 1004" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="map-leg">
      <span class="ml-item"><span class="ml-dot" style="background:#4ade80"></span>Trabajar</span>
      <span class="ml-item"><span class="ml-dot" style="background:#fbbf24"></span>Avanzar</span>
      <span class="ml-item"><span class="ml-dot" style="background:#f87171"></span>No priorizar</span>
      <span class="ml-item"><span class="ml-dot" style="background:#3a4257"></span>Falta relevar</span>
    </div>
  </div>`;
  document.getElementById('main').innerHTML=html;
  drawMap();
}

function drawMap(){
  const svg=document.getElementById('mapSvg'); if(!svg) return;
  const {byLoc}=DATA;
  let s='';
  BASEDATA.forEach(b=>{
    const p=PXMAP[b.id]; if(!p) return;
    const c=byLoc[b.id].cons;
    const col=c.tipo?EVAL_DEF[c.tipo].col:'#3a4257';
    const r=c.tipo?(8+Math.min(c.tot,5)*2):6;
    const pulse=c.tipo==='actuar'?' class="dot-pulse"':'';
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="'+col+'" fill-opacity="0.9" stroke="#0e1420" stroke-width="1.5" style="cursor:pointer"'+pulse+' onclick="showFicha(\''+b.id+'\')"><title>'+b.n+'</title></circle>';
  });
  svg.innerHTML=s;
}

function showFicha(id){
  const bd=BD[id]; const ld=DATA.byLoc[id]; if(!bd||!ld) return;
  const c=ld.cons;
  const box=document.getElementById('fichaBox');
  // Badge
  let badge,bcls;
  if(c.tipo){ const d=EVAL_DEF[c.tipo]; badge=d.ico+' '+d.txt; bcls='fb-'+c.tipo; }
  else { badge='Sin lectura aún'; bcls='fb-none'; }
  // Bloque 1: datos electorales
  const gobPS = bd.psEjec;
  let datosHTML='<div class="bloque-tit">📋 Lo que ya sabíamos</div><div class="datos-grid">'
    +'<div class="dato"><div class="dato-lbl">Tipo</div><div class="dato-val">'+(bd.muni?'Municipio':'Comuna')+'</div></div>'
    +'<div class="dato"><div class="dato-lbl">Gobierna</div><div class="dato-val'+(gobPS?' ps':'')+'">'+(bd.gob||'—')+'</div></div>'
    +'<div class="dato"><div class="dato-lbl">Electores</div><div class="dato-val">'+(bd.el?bd.el.toLocaleString('es'):'—')+'</div></div>'
    +'<div class="dato"><div class="dato-lbl">Centro PS</div><div class="dato-val'+(bd.centroPS?' ps':'')+'">'+(bd.centroPS?'Sí':'No')+'</div></div>'
    +(bd.congresal?'<div class="dato"><div class="dato-lbl">Congresales PS</div><div class="dato-val ps">'+bd.congresal+'</div></div>':'')
    +'</div>';
  // Bloque 2: mirada del equipo en %
  let miradaHTML='<div class="bloque-tit">📊 La mirada del equipo</div>';
  if(c.tot>0){
    const pa=Math.round(c.c.actuar/c.tot*100), pi=Math.round(c.c.intentar/c.tot*100), pn=Math.round(c.c.no/c.tot*100);
    const row=(lbl,pct,cls)=> pct>0?'<div class="mbar-row"><span class="mbar-lbl">'+lbl+'</span><div class="mbar-track"><div class="mbar-fill '+cls+'" style="width:'+pct+'%">'+(pct>=12?pct+'%':'')+'</div></div><span class="mbar-pct">'+pct+'%</span></div>':'';
    miradaHTML+='<div class="mirada-bars">'+row('✅ Oportunidad',pa,'mf-actuar')+row('🔄 Intentarlo',pi,'mf-intentar')+row('🚫 Profundizar',pn,'mf-no')+'</div>'
      +'<div style="font-size:11px;color:#6b7689;margin-top:6px">Sobre '+c.tot+' opinion'+(c.tot>1?'es':'')+' del equipo</div>';
  } else {
    miradaHTML+='<div style="font-size:13px;color:#6b7689;font-style:italic">Todavía nadie con conocimiento evaluó esta localidad.</div>';
  }
  // Bloque 3: vínculos por categoría con % e incidencia (TODAS las categorías)
  const totVnc=ld.vncs.length;
  const porCat={}; CATS.forEach(cat=>porCat[cat.id]=0);
  ld.vncs.forEach(v=>{ if(porCat[v.tipo]!==undefined) porCat[v.tipo]++; else porCat.otro++; });
  let catsHTML='<div class="bloque-tit">🔗 Vínculos por categoría ('+totVnc+')</div><div class="cat-grid">';
  CATS.forEach(cat=>{
    const n=porCat[cat.id];
    const pct= totVnc>0?Math.round(n/totVnc*100):0;
    const inc=incidencia(pct);
    catsHTML+='<div class="cat-item'+(n===0?' vacia':'')+'"><div class="cat-top"><span class="cat-ico">'+cat.ico+'</span><span class="cat-name">'+cat.name+'</span><span class="cat-n">'+n+'</span></div>'
      +'<div class="cat-bar"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+(pct>=40?'#4ade80':pct>=20?'#fbbf24':pct>0?'#8b97ab':'transparent')+'"></div></div>'
      +'<div class="cat-foot"><span class="cat-pct">'+pct+'%</span><span class="cat-inc '+inc.cls+'">'+inc.lbl+'</span></div></div>';
  });
  catsHTML+='</div>';
  // Detalle de los vínculos cargados
  let detHTML='';
  if(totVnc>0){
    detHTML='<div class="vnc-detalle">';
    ld.vncs.forEach(v=>{
      const cat=CATMAP[v.tipo]||{ico:'📌',name:v.tipo};
      detHTML+='<div class="vd-row"><span class="vd-ico">'+cat.ico+'</span><div><div class="vd-nombre">'+v.nombre+' <span class="vd-cat">· '+cat.name+'</span></div>'+(v.vinculo?'<div class="vd-det">'+v.vinculo+'</div>':'')+'</div></div>';
    });
    detHTML+='</div>';
  }
  box.innerHTML='<div class="ficha-hd"><div><div class="ficha-loc">'+bd.n+'</div><div class="ficha-sub">Departamento Castellanos</div></div><div class="ficha-badge '+bcls+'">'+badge+'</div></div>'
    +'<div class="ficha-body">'+datosHTML+miradaHTML+catsHTML+detHTML+'</div>';
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
loadData();
</script>
