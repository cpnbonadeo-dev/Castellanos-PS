<style>
:root{--bg:#0a0f1e;--card:#111827;--border:#1e2d45;--red:#e63946;--gold:#f59e0b;--blue:#3b82f6;--green:#22c55e;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* NAV */
nav{background:var(--red);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:10px;flex-wrap:wrap}
.nav-brand{font-family:'Bebas Neue',sans-serif;font-size:20px;color:white;letter-spacing:2px;white-space:nowrap;text-decoration:none}
.nav-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav-links a{color:rgba(255,255,255,.9);text-decoration:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:6px;transition:all .15s;white-space:nowrap}
.nav-links a:hover{background:rgba(255,255,255,.15)}
.nav-links a.active{background:#fff;color:var(--red);font-weight:700}
.nav-links a.nav-hero{background:rgba(255,255,255,.18);font-size:15px;font-weight:700;padding:10px 20px;border-radius:8px}
.nav-links a.nav-hero.active{background:#fff;color:var(--red)}
.nav-links a.nav-panel-link{background:rgba(0,0,0,.22);color:rgba(255,255,255,.85);font-size:12px;border:1px solid rgba(255,255,255,.25)}
@media(max-width:580px){
  nav{padding:8px 12px}
  .nav-brand{font-size:17px;width:100%;margin-bottom:4px}
  .nav-links{width:100%;gap:5px}
  .nav-links a{font-size:11px;padding:5px 8px;flex:1;text-align:center}
}

/* HERO */
.hero{background:linear-gradient(135deg,#0a0f1e 0%,#0d1a2e 60%,#111827 100%);padding:28px 20px 20px;border-bottom:1px solid var(--border)}
.hero-inner{max-width:1140px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:4px;color:#fff;line-height:1}
.hero-sub{font-size:13px;color:var(--muted);margin-top:4px}
.date-badge{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--gold);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);padding:6px 14px;border-radius:20px;white-space:nowrap}

/* FILTROS */
.filter-bar{max-width:1140px;margin:20px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{font-size:12px;font-weight:700;letter-spacing:1px;padding:7px 18px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;text-transform:uppercase;white-space:nowrap}
.filter-btn:hover{border-color:#2a3a5a;color:#fff}
.filter-btn.on{background:var(--red);border-color:var(--red);color:#fff}
.filter-btn.ps-loc{border-color:rgba(245,158,11,.3);color:var(--gold)}
.filter-btn.ps-loc:hover{border-color:var(--gold)}
.filter-btn.ps-loc.on{background:var(--gold);border-color:var(--gold);color:#000}
.filter-count{font-size:10px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:8px;margin-left:4px}
@media(max-width:700px){
  .filter-bar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .filter-bar::-webkit-scrollbar{display:none}
}

/* DESTACADAS */
.dest-section{max-width:1140px;margin:20px auto 0;padding:0 20px}
.dest-header{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dest-header::after{content:'';flex:1;height:1px;background:rgba(245,158,11,.2)}
.dest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.nc.dest-card{border-color:rgba(245,158,11,.35);box-shadow:0 0 0 1px rgba(245,158,11,.15)}
.dest-badge{position:absolute;top:7px;right:7px;background:var(--gold);color:#000;font-size:9px;font-weight:900;letter-spacing:1px;padding:3px 7px;border-radius:4px;z-index:3}
@media(max-width:480px){.dest-grid{grid-template-columns:1fr}}

/* GRID */
.grid-wrap{max-width:1140px;margin:18px auto 60px;padding:0 20px}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media(max-width:480px){.news-grid{grid-template-columns:1fr}}

/* CARD */
.nc{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .15s}
.nc:hover{border-color:#2a3a5a;transform:translateY(-2px)}

/* THUMBNAIL */
.nc-thumb{width:100%;height:160px;overflow:hidden;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;background:#0d1a2e}
.nc-thumb img.main-img{width:100%;height:100%;object-fit:cover;display:block}
.nc-thumb .play-icon{position:absolute;width:44px;height:44px;background:rgba(0,0,0,.65);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;pointer-events:none}
/* skeleton shimmer mientras carga OG */
.nc-thumb.og-load{background:linear-gradient(90deg,#111827 25%,#1e293b 50%,#111827 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* pill de fuente sobre imagen */
.nc-src-pill{position:absolute;bottom:7px;left:7px;background:rgba(0,0,0,.68);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:#ccc;letter-spacing:.3px;display:flex;align-items:center;gap:5px;z-index:2}
.nc-src-pill img{width:13px;height:13px;border-radius:2px}
/* fallback cuando no hay imagen OG */
.nc-fallback-ig{background:linear-gradient(135deg,#405de6,#833ab4,#fd1d1d);width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:44px}
.nc-fallback-fb{background:#1877F2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:56px;font-weight:900;color:#fff;line-height:1}
.nc-fallback-web{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.nc-favicon{width:36px;height:36px;border-radius:8px;background:#1e293b;padding:4px;overflow:hidden}
.nc-favicon img{width:100%;height:100%;object-fit:contain}
.nc-domain{font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:.3px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-favicon{width:32px;height:32px;border-radius:6px;background:#1e293b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.nc-favicon img{width:100%;height:100%;object-fit:contain}
.nc-domain{font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:.5px;text-align:center;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* BODY */
.nc-body{padding:13px 14px;flex:1;display:flex;flex-direction:column}
.nc-sec{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.sec-s{color:#f59e0b}.sec-d{color:#22c55e}.sec-r{color:#60a5fa}
.nc-title{font-size:14px;font-weight:700;color:#fff;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nc-desc{font-size:12px;color:#94a3b8;line-height:1.55;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-foot{display:flex;align-items:center;justify-content:flex-end;margin-top:10px}
.nc-link{font-size:11px;font-weight:700;color:var(--red);text-decoration:none;padding:5px 12px;border:1px solid rgba(230,57,70,.4);border-radius:6px;transition:all .15s}
.nc-link:hover{background:var(--red);color:#fff}

/* AGENDA THUMB (sin URL) */
.nc-agenda-thumb{background:linear-gradient(135deg,#0d1a2e 0%,#1a2744 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nc-agenda-cal{font-size:48px;opacity:.18;line-height:1}
.nc-agenda-f{font-family:'Bebas Neue',sans-serif;font-size:28px;color:rgba(255,255,255,.5);letter-spacing:2px;text-align:center;line-height:1.1}
/* Fecha badge en card body */
.nc-fecha{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--gold);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);padding:2px 9px;border-radius:10px;margin-bottom:6px}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;grid-column:1/-1}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:20px;text-align:center;font-size:12px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
</style>
</head>

// ─── HELPERS ───────────────────────────────────────────────────────────────
function tipo(u){
  if(/youtu/.test(u)) return 'yt';
  if(/instagram\.com/.test(u)) return 'ig';
  if(/facebook\.com/.test(u)) return 'fb';
  return 'web';
}
function ytId(u){
  const m=u.match(/(?:youtu\.be\/|[?&]v=)([a-zA-Z0-9_-]{11})/);
  return m?m[1]:null;
}
function domain(u){
  try{return new URL(u).hostname.replace(/^www\./,'');}catch{return u;}
}
const SEC_CLS={Sunchales:'sec-s',Departamento:'sec-d',Rafaela:'sec-r'};
const SEC_LBL={Sunchales:'Sunchales',Departamento:'Departamento',Rafaela:'Rafaela'};

function fallback(item){
  const t=tipo(item.u), dom=domain(item.u);
  const pill=`<div class="nc-src-pill"><img src="https://www.google.com/s2/favicons?domain=${dom}&sz=32" alt="">${dom}</div>`;
  if(t==='ig') return `<div class="nc-fallback-ig">📸</div>${pill}`;
  if(t==='fb') return `<div class="nc-fallback-fb">f</div>${pill}`;
  return `<div class="nc-fallback-web">
    <div class="nc-favicon"><img src="https://www.google.com/s2/favicons?domain=${dom}&sz=64" alt=""></div>
    <div class="nc-domain">${dom}</div>
  </div>`;
}

function thumb(item){
  // Sin URL: diseño de agenda
  if(!item.u){
    return `<div class="nc-thumb nc-agenda-thumb">
      <div class="nc-agenda-cal">📅</div>
      <div class="nc-agenda-f">${item.fecha||''}</div>
    </div>`;
  }
  const t=tipo(item.u);
  // YouTube: thumbnail directo, sin API
  if(t==='yt'){
    const id=ytId(item.u);
    return `<div class="nc-thumb"><img class="main-img" src="https://img.youtube.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy"><div class="play-icon">▶</div></div>`;
  }
  // Todo lo demás: skeleton que carga la imagen OG vía microlink
  const enc=encodeURIComponent(item.u);
  return `<div class="nc-thumb og-load" data-url="${enc}" data-tipo="${t}" data-dom="${domain(item.u)}">${fallback(item)}</div>`;
}

function mkCard(item){
  const sc=SEC_CLS[item.s]||'';
  const sl=item.loc||SEC_LBL[item.s]||item.s;
  const thumbWrap=item.u
    ?`<a href="${item.u}" target="_blank" rel="noopener" style="display:block;text-decoration:none">${thumb(item)}</a>`
    :thumb(item);
  const foot=item.u
    ?`<div class="nc-foot"><a class="nc-link" href="${item.u}" target="_blank" rel="noopener">Ver →</a></div>`
    :'';
  return `<div class="nc" data-s="${item.s}">
    ${thumbWrap}
    <div class="nc-body">
      ${item.fecha?`<span class="nc-fecha">${item.fecha}</span>`:''}
      <div class="nc-sec ${sc}">${sl}</div>
      <div class="nc-title">${item.t}</div>
      ${item.d?`<div class="nc-desc">${item.d}</div>`:''}
      ${foot}
    </div>
  </div>`;
}

// ─── RENDER + FILTROS ──────────────────────────────────────────────────────
const grid=document.getElementById('grid');
const btns=document.querySelectorAll('.filter-btn');
let filtro='todos';

// Localidades PS — en el campo `loc` de cada item
const PS_LOCS=['Sunchales','Rafaela','Col. Margarita','Colonia Raquel','Eusebia',
               'Maúa','Zenón Pereyra','Colonia Aldao','Col. Iturraspe','Garibaldi','San Vicente','Departamento'];

// Matching: loc > s (fallback para items sin campo loc)
function matchLoc(n,f){
  if(f==='todos') return true;
  const loc=n.loc||n.s;
  return loc===f;
}

// ─── MICROLINK OG-IMAGE OBSERVER ──────────────────────────────────────────
const ogObserver=new IntersectionObserver(async entries=>{
  for(const entry of entries){
    if(!entry.isIntersecting) continue;
    const el=entry.target;
    ogObserver.unobserve(el);
    const url=decodeURIComponent(el.dataset.url);
    try{
      const r=await fetch('https://api.microlink.io?url='+encodeURIComponent(url));
      const j=await r.json();
      const img=j?.data?.image?.url||j?.data?.screenshot?.url;
      if(img){
        // Guardamos el pill antes de borrar todo
        const pill=el.querySelector('.nc-src-pill');
        el.classList.remove('og-load');
        el.innerHTML='<img class="main-img" src="'+img+'" alt="" loading="lazy" onerror="this.parentElement.classList.remove(\'og-load\')">'
          +(pill?pill.outerHTML:'');
      } else {
        el.classList.remove('og-load');
      }
    }catch(e){ el.classList.remove('og-load'); }
  }
},{rootMargin:'200px'});

function attachObserver(){
  document.querySelectorAll('.nc-thumb.og-load').forEach(el=>{
    if(el._obs) return;
    el._obs=true;
    ogObserver.observe(el);
  });
}

// ─── DESTACADAS ────────────────────────────────────────────────────────────
const destSection=document.getElementById('destSection');
const destGrid=document.getElementById('destGrid');

function renderDest(){
  const dest=NOTICIAS.filter(n=>n.dest).slice(0,5);
  if(!dest.length){ destSection.style.display='none'; return; }
  destSection.style.display='';
  destGrid.innerHTML=dest.map(n=>{
    // Inject badge into thumb via a wrapper trick
    const card=mkCard(n);
    // Add dest-card class and badge
    return card
      .replace('<div class="nc"','<div class="nc dest-card"')
      .replace('<div class="nc-thumb','<div class="nc-thumb" style="position:relative"><span class="dest-badge">⭐ DESTACADA</span></div><div class="nc-thumb-inner" style="display:none"></div><div class="nc-thumb');
  }).join('').replace(/<\/div><div class="nc-thumb-inner" style="display:none"><\/div>/g,'');
  // Simpler: rebuild with badge inside thumb
  destGrid.innerHTML=dest.map(n=>{
    const raw=mkCard(n);
    return raw
      .replace('<div class="nc"','<div class="nc dest-card"')
      .replace(/(class="nc-thumb[^"]*">)/,'$1<span class="dest-badge">⭐ DESTACADA</span>');
  }).join('');
  attachObserverIn(destGrid);
}

function attachObserverIn(container){

}

// ─── AUTO-LOAD DESDE GOOGLE DOC ────────────────────────────────────────────
const SCRIPT_URL_NOTICIAS='https://script.google.com/macros/s/AKfycbwmpSY0mT7oEx_Ya0sdmiUw0qb-7u6McS54f8qzmt9sShsCQ-xs92CTb6Fdln2xb3JY/exec';

// Keywords de localidad para inferir `loc` en items de DEPARTAMENTO
const LOC_KW_N=[
  ['Sunchales',['sunchales']],
  ['Rafaela',['rafaela']],
  ['Col. Margarita',['col. margarita','colonia margarita']],
  ['Colonia Raquel',['colonia raquel','col. raquel']],
  ['Eusebia',['eusebia']],
  ['Maúa',['maúa','maua']],
  ['Zenón Pereyra',['zenón pereyra','zenon pereyra']],
  ['Colonia Aldao',['colonia aldao','col. aldao','aldao']],
  ['Col. Iturraspe',['iturraspe']],
  ['Garibaldi',['garibaldi']],
  ['Ataliva',['ataliva']],
  ['San Vicente',['san vicente']],
  ['María Juana',['maría juana','maria juana']],
  ['Humberto Primo',['humberto primo']],
  ['Bella Italia',['bella italia']],
  ['Ramona',['ramona']],
  ['Frontera',['frontera']],
  ['Angélica',['angélica','angelica']],
];

function guessLocN(txt){
  const lc=txt.toLowerCase();
  for(const [loc,kws] of LOC_KW_N){
    if(kws.some(k=>lc.includes(k))) return loc;
  }
  return '';
}

function parseNoticiasDoc(text){
  // Encabezados de sección — regex estrictos con $ para no confundir títulos de noticias
  // "DEPARTAMENTO 1", "RAFAELA 2", etc. → match; "Rafaela suma obras" → no match
  const SEC_MAP=[
    [/^sunchales\s*\d*$/i,    {s:'Sunchales',   loc:'Sunchales'}],
    [/^rafaela\s*\d*$/i,      {s:'Rafaela',     loc:'Rafaela'}],
    [/^departamento\s*\d*$/i, {s:'Departamento',loc:''}],
  ];

  const items=[];
  let curSec={s:'Departamento',loc:''};
  let skip=false;

  // Dividir en párrafos (2+ saltos de línea)
  const paras=text.split(/\n{2,}/).map(p=>p.trim()).filter(p=>p.length>0);

  for(const para of paras){
    // Limpiar asteriscos y guiones bajos (formato Google Docs bold/italic)
    const cleaned=para.replace(/[*_]/g,'').trim();
    const lines=cleaned.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    if(!lines.length) continue;

    // ¿Primera línea es encabezado de sección? (aunque esté pegada al primer ítem)
    let foundSec=false;
    for(const [re,sec] of SEC_MAP){
      if(re.test(lines[0])){
        curSec=sec; skip=false; foundSec=true;
        lines.splice(0,1); // quitar la línea del encabezado
        break;
      }
    }
    // Sección PROVINCIA → skip
    if(!foundSec && /^provincia/i.test(lines[0])){
      skip=true; continue;
    }
    if(foundSec && lines.length===0) continue; // header solo, sin contenido
    if(skip) continue;

    // Separar líneas con URL de líneas de texto
    const urls=[];
    const textLines=[];
    for(const l of lines){
      const m=l.match(/https?:\/\/\S+/);
      if(m){
        urls.push(m[0].replace(/[,.)\]>]+$/,''));
        const before=l.slice(0,m.index).replace(/^video\s*/i,'').trim();
        if(before) textLines.push(before);
      } else {
        textLines.push(l);
      }
    }

    const mainUrl=urls[0]||'';
    if(!textLines.length && !mainUrl) continue;

    // Saltar si es solo un enlace a docs.google.com (tabla de contenidos)
    if(!textLines.length && mainUrl.includes('docs.google.com')) continue;

    // Detectar DESTACADO
    const fullRaw=textLines.join(' ');
    const dest=/DESTACADO/i.test(fullRaw);

    const t=(textLines[0]||domain(mainUrl)||'').replace(/DESTACADO/gi,'').trim();
    const d=textLines.slice(1).join(' ').replace(/\s+/g,' ').replace(/DESTACADO/gi,'').trim();
    if(!t) continue;

    const loc=curSec.loc||guessLocN(t+' '+d);
    const item={t,d,u:mainUrl,s:curSec.s,loc};
    if(dest) item.dest=true;
    items.push(item);
  }

  return items;
}

function updateCounts(){
  document.getElementById('cnt-todos').textContent=NOTICIAS.length;
  PS_LOCS.forEach(s=>{
    const el=document.getElementById('cnt-'+s);
    if(el) el.textContent=NOTICIAS.filter(n=>matchLoc(n,s)).length||'';
  });
}

// JSONP: evita el bloqueo CORS de Google Apps Script
function fetchJsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='_nc'+Date.now();
    const s=document.createElement('script');
    const t=setTimeout(()=>{ cleanup(); reject(new Error('timeout')); },10000);
    function cleanup(){ delete window[cb]; s.parentNode&&s.parentNode.removeChild(s); clearTimeout(t); }
    window[cb]=(data)=>{ cleanup(); resolve(data); };
    s.onerror=(e)=>{ cleanup(); reject(e); };
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.head.appendChild(s);
  });
}

async function init(){
  // Render inmediato con datos de fallback (sin esperar al fetch)
  updateCounts();
  renderDest();
  render();

  if(!SCRIPT_URL_NOTICIAS) return;
  try{
    const j=await fetchJsonp(SCRIPT_URL_NOTICIAS);
    if(j.ok && j.text){
      const parsed=parseNoticiasDoc(j.text);
      if(parsed.length>=3){
        NOTICIAS=parsed;
        // Actualizar badge de fecha a hoy
        const badge=document.getElementById('dateBadge');
        if(badge) badge.textContent=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
        // Re-render con datos frescos
        updateCounts();
        renderDest();
        render();
      }
    }
  }catch(e){ console.warn('Noticias: usando datos locales.',e); }
}

init();
