<style>
:root {
  --azul: #1a56db;
  --azul-oscuro: #1e3a8a;
  --azul-medio: #2563eb;
  --azul-claro: #dbeafe;

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: "DM Sans", sans-serif; background: var(--azul-muy-claro); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

#pantalla-inicio {

  gap: 32px; padding: 40px; text-align: center;
}
#pantalla-inicio h1 { font-family: "DM Serif Display", serif; font-size: 56px; color: white; line-height: 1.1; }
#pantalla-inicio p { font-size: 22px; color: rgba(255,255,255,0.75); line-height: 1.5; }
.btn-empezar {

}
.btn-empezar:active { transform: scale(0.97); }

#app { width: 100%; max-width: 430px; min-height: 100vh; display: flex; flex-direction: column; padding: 0 0 200px; }

.header {
  background: linear-gradient(135deg, var(--azul-oscuro), var(--azul-medio));
  padding: 28px 20px 18px;
}
.header-top { display: flex; justify-content: space-between; align-items: center; }
.header-nombre { font-family: "DM Serif Display", serif; font-size: 30px; color: white; }
.modo-badge {
  padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
  background: rgba(255,255,255,0.2); color: white;
}
.mic-estado { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.mic-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: background 0.3s; }
.mic-dot.activo { background: #4ade80; animation: parpadeo 1s infinite; }
.mic-dot.espera { background: #fbbf24; animation: parpadeo 2s infinite; }
@keyframes parpadeo { 0%,100%{opacity:1} 50%{opacity:0.3} }
.mic-texto { font-size: 14px; color: rgba(255,255,255,0.7); }

.agua-barra {
  background: rgba(255,255,255,0.15); border-radius: 12px;
  padding: 10px 14px; margin-top: 10px;
  display: flex; align-items: center; gap: 10px;
}
.agua-label { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 600; flex: 1; }
.agua-progress { flex: 2; background: rgba(255,255,255,0.2); border-radius: 6px; height: 8px; }
.agua-fill { height: 8px; border-radius: 6px; background: #4ade80; transition: width 0.5s; }
.agua-num { font-size: 13px; color: white; font-weight: 700; min-width: 40px; text-align: right; }

.chat { flex: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; scroll-behavior: smooth; }

.burbuja { max-width: 88%; padding: 16px 20px; border-radius: 22px; font-size: 20px; line-height: 1.55; animation: aparecer 0.25s ease; }
@keyframes aparecer { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.burbuja.asistente { background: white; color: var(--texto); align-self: flex-start; border-bottom-left-radius: 5px; box-shadow: var(--sombra); }
.burbuja.coca { background: var(--azul-medio); color: white; align-self: flex-end; border-bottom-right-radius: 5px; }
.burbuja.sistema { background: #fef3c7; color: #92400e; align-self: center; border-radius: 14px; font-size: 15px; font-weight: 600; text-align: center; max-width: 95%; border: 2px solid #f59e0b; }
.pensando { display: flex; align-items: center; gap: 6px; padding: 16px 20px; background: white; border-radius: 22px; align-self: flex-start; box-shadow: var(--sombra); }
.dot { width: 10px; height: 10px; background: var(--azul); border-radius: 50%; animation: rebotar 1.2s infinite; }
.dot:nth-child(2){animation-delay:0.2s} .dot:nth-child(3){animation-delay:0.4s}
@keyframes rebotar { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-10px)} }

.zona-inferior {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px; background: white;
  border-top: 1px solid var(--azul-claro);
  padding: 14px 16px 28px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  box-shadow: 0 -4px 24px rgba(30,58,138,0.08);
}
.btn-mic {
  width: 90px; height: 90px;

}
.btn-mic.escuchando { background: linear-gradient(135deg, #dc2626, #ef4444); animation: onda 1.2s infinite; }
.btn-mic.espera { background: linear-gradient(135deg, #d97706, #f59e0b); }
@keyframes onda { 0%{box-shadow:0 0 0 0 rgba(220,38,38,0.5)} 70%{box-shadow:0 0 0 22px rgba(220,38,38,0)} 100%{box-shadow:0 0 0 0 rgba(220,38,38,0)} }
.btn-mic:active { transform: scale(0.92); }
.mic-hint { font-size: 14px; color: var(--texto-suave); font-weight: 500; }

.familia-label { font-size: 12px; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.5px; align-self: flex-start; }
.familia-grid { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.btn-familiar {

  padding: 10px 16px; font-family: "DM Sans", sans-serif; font-size: 17px; font-weight: 600;
  color: var(--azul-oscuro); cursor: pointer; transition: all 0.2s; flex: 1; min-width: 70px; text-align: center;
}
.btn-familiar:active { background: var(--azul-claro); transform: scale(0.96); }

#panel-llamada { display: none; position: fixed; inset: 0; z-index: 500; background: linear-gradient(160deg, #1e3a8a, #1a56db); flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px; text-align: center; }
#panel-llamada.show { display: flex; }
#panel-llamada h2 { font-family: "DM Serif Display", serif; font-size: 30px; color: white; line-height: 1.2; }
#panel-llamada p { font-size: 19px; color: rgba(255,255,255,0.75); }
.btns-llamada-noche { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.btn-llamar-noche { background: white; color: var(--azul-oscuro); border: none; border-radius: 16px; padding: 20px; font-family: "DM Sans", sans-serif; font-size: 20px; font-weight: 700; cursor: pointer; width: 100%; }
.btn-no-llamar { background: rgba(255,255,255,0.15); color: white; border: 2px solid rgba(255,255,255,0.4); border-radius: 16px; padding: 16px; font-family: "DM Sans", sans-serif; font-size: 17px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 4px; }

#alerta { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(220,38,38,0.95); flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px; text-align: center; }
#alerta.show { display: flex; }
#alerta h2 { font-size: 28px; font-weight: 700; color: white; }
#alerta p { font-size: 18px; color: rgba(255,255,255,0.85); }
.al-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.al-btn { padding: 20px; border-radius: 16px; border: none; font-family: "DM Sans", sans-serif; font-size: 20px; font-weight: 700; cursor: pointer; }
.al-btn.primario { background: white; color: #dc2626; }
.al-btn.secundario { background: rgba(255,255,255,0.15); color: white; border: 2px solid white; }
</style>
</head>

<div id="app" style="display:none">

<script>
const CLAUDE_KEY = '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';

const CONTACTOS = [

const CUMPLEANOS = [
  { nombre: "Ariel", dia: 21, mes: 11 },
  { nombre: "Diego", dia: 2, mes: 5 },
  { nombre: "Tami", dia: 5, mes: 5 },
  { nombre: "Franco", dia: 31, mes: 7 },
  { nombre: "Emilio", dia: 8, mes: 4 },
  { nombre: "Paula", dia: 16, mes: 5 },
  { nombre: "Nando (recordar con carino)", dia: 30, mes: 5 },
  { nombre: "Coca", dia: 5, mes: 12 },
];

const PALABRAS_EMERGENCIA = ["me cai","me caí","no puedo respirar","me siento muy mal","me siento mal","no me siento bien","ayuda urgente","auxilio","emergencia","me desmaye","me duele mucho"];
const WAKE_WORDS = ["florencia","marco","hola","necesito ayuda","me cai","me caí","ayuda","emergencia","tengo un problema"];
const PALABRAS_CIERRE = ["chau","hasta luego","nos vemos","chau florencia","hasta manana florencia","me voy a dormir florencia","basta florencia"];

// MODOS: en_casa, jugando, seguridad, descanso
let modoActual = localStorage.getItem("modoCoca") || "en_casa";
let historial = [];
let hablando = false;
let grabando = false;
let reconocimiento = null;
let escuchaContinua = false;
let conversacionActiva = false;
let modoEspera = false;
let silenciosConsecutivos = 0;
const MAX_SILENCIOS = 12;

// AGUA
let aguaMl = parseInt(localStorage.getItem("coca_agua_hoy") || "0");
const AGUA_META = 1500;

// SEGURIDAD
let chequeoInterval = null;
let esperandoChequeo = false;
let intentosChequeo = 0;
let timerChequeo = null;

// ACTIVIDADES (modo jugando)
let actividadInterval = null;
let ultimaActividad = 0;
const SABIAS_QUE = [
  "Sabes que Las Palmeras son de Santa Fe capital y llevan mas de 60 anos tocando? Empezaron en 1964 y siguen siendo el grupo de cumbia mas querido de la region.",
  "Sabes que Argentina tiene la libreria mas bonita del mundo? El Ateneo Grand Splendid en Buenos Aires, que era un teatro y lo convirtieron en libreria.",
  "Sabes que los pulpos tienen tres corazones y la sangre azul? Es verdad, usan cobre en vez de hierro.",
  "Sabes que el dulce de leche lo inventaron en Argentina? Hay una historia que dice que fue en la estancia de Juan Manuel de Rosas.",
  "Sabes que Santa Fe fue la primera ciudad en tener agua corriente en Argentina? En 1887 ya tenia agua potable.",
  "Sabes que el tango nacio en los conventillos del Rio de la Plata a fines del 1800? Al principio era bailado solo por hombres.",
  "Sabes que la yerba mate tiene mas antioxidantes que el te verde? Y ademas es diuretica, aunque con todo el agua que toman los que toman mate no se nota.",
  "Sabes que el hornero, el pajaro nacional argentino, construye su nido con barro y paja? Tarda meses en hacerlo y lo usa una sola vez.",
  "Sabes que Laguna Paiva debe su nombre a una laguna que existia cerca? Con el tiempo se fue secando pero el nombre quedó.",
  "Sabes que Las Palmeras grabaron mas de 40 discos? Su cancion mas famosa es Palmeras Mix pero tienen cumbia sabrosa de toda la vida.",
];

const PALMERAS_SONGS = [
  { cancion: "Palmeras Mix", url: "https://www.youtube.com/results?search_query=Las+Palmeras+Palmeras+Mix" },
  { cancion: "Cumbia Sabrosa", url: "https://www.youtube.com/results?search_query=Las+Palmeras+Cumbia+Sabrosa" },
  { cancion: "El Africano", url: "https://www.youtube.com/results?search_query=Las+Palmeras+El+Africano" },
  { cancion: "La Pollera Colora", url: "https://www.youtube.com/results?search_query=Las+Palmeras+La+Pollera+Colora" },
];

const ACTIVIDADES = [
  function(){ proponer("Coca, te tengo un chiste. Queres escucharlo?"); },
  function(){ 
    const s = SABIAS_QUE[Math.floor(Math.random() * SABIAS_QUE.length)];
    proponer(s + " Te parecia?");
  },
  function(){ proponer("Coca, como conociste a Nando? Siempre me da curiosidad esa historia."); },
  function(){ proponer("Coca, que estas mirando en la tele? En el canal 11 de Telefe debe haber algo bueno ahora."); },
  function(){ proponer("Coca, te cuento algo que paso hoy en Argentina?"); },
  function(){ proponer("Coca, como era Laguna Paiva cuando eras chica? Habia mucho movimiento?"); },
  function(){ proponer("Coca, hace un rato que no hablas con los chicos. Los llamamos?"); },
  function(){ 
    const p = PALMERAS_SONGS[Math.floor(Math.random() * PALMERAS_SONGS.length)];
    proponer("Coca, te pongo una de Las Palmeras? " + p.cancion + " es un clasico.");
  },
  function(){ proponer("Coca, que hiciste hoy? Contame como estuvo el dia."); },
  function(){ proponer("Coca, cuanto agua tomaste hoy? Contame para llevar la cuenta juntas."); },
];
let idxActividad = 0;

function proponer(msg) {
  if (hablando || modoActual === "descanso" || protocoloRemediosActivo) return;
  agregarBurbuja(msg, "asistente");
  hablar(msg);
}

// AGUA TRACKER
function registrarAgua(ml) {
  aguaMl = Math.min(aguaMl + ml, AGUA_META);
  localStorage.setItem("coca_agua_hoy", aguaMl.toString());
  actualizarBarraAgua();
  enviarASheets({ tipo: "agua", resumen: "Tomo " + ml + "ml. Total: " + aguaMl + "ml de " + AGUA_META + "ml", estado: "", chequeo: "", agua: aguaMl + "ml" });
}

function actualizarBarraAgua() {
  const pct = Math.min(100, (aguaMl / AGUA_META) * 100);
  document.getElementById("agua-fill").style.width = pct + "%";
  const litros = (aguaMl / 1000).toFixed(1);
  const vasos = Math.round(aguaMl / 250);
  document.getElementById("agua-num").textContent = vasos + " / 6 vasos";
}

// Resetear agua a medianoche
function chequearResetAgua() {
  const ultimaFecha = localStorage.getItem("coca_agua_fecha");
  const hoy = new Date().toLocaleDateString("es-AR");
  if (ultimaFecha !== hoy) {
    aguaMl = 0;
    localStorage.setItem("coca_agua_hoy", "0");
    localStorage.setItem("coca_agua_fecha", hoy);
    actualizarBarraAgua();
  }
}

// CUMPLEANOS
function chequearCumpleanos() {
  const hoy = new Date();
  const dia = hoy.getDate();
  const mes = hoy.getMonth() + 1;
  CUMPLEANOS.forEach(function(c) {
    if (c.dia === dia && c.mes === mes) {
      const msg = "Coca, hoy es el cumpleanos de " + c.nombre + ". No te olvides de saludar!";
      setTimeout(function() { proponer(msg); }, 5000);
    }
    // Avisar 2 dias antes
    const fecha = new Date();
    fecha.setDate(fecha.getDate() + 2);
    if (c.dia === fecha.getDate() && c.mes === (fecha.getMonth() + 1)) {
      const msg = "Coca, en dos dias es el cumpleanos de " + c.nombre + ". Por si queres preparar algo o llamarlo.";
      setTimeout(function() { proponer(msg); }, 8000);
    }
  });
}

// MODO
function aplicarModo(modo) {
  modoActual = modo;
  const badges = { en_casa: "En Casa", jugando: "Jugando", seguridad: "Seguridad", descanso: "Descanso" };
  document.getElementById("modo-badge").textContent = badges[modo] || "En Casa";

  // Detener intervalos anteriores
  if (chequeoInterval) { clearInterval(chequeoInterval); chequeoInterval = null; }
  if (actividadInterval) { clearInterval(actividadInterval); actividadInterval = null; }
  if (timerChequeo) { clearTimeout(timerChequeo); timerChequeo = null; }

  if (modo === "seguridad") {
    chequeoInterval = setInterval(hacerChequeo, 20 * 60 * 1000);
  }
  if (modo === "jugando") {
    // Primera actividad a los 2 minutos, luego cada 30
    setTimeout(function() {
      if (modoActual === "jugando" && !hablando && !modoEspera) {
        ACTIVIDADES[idxActividad % ACTIVIDADES.length]();
        idxActividad++;
      }
    }, 2 * 60 * 1000);
    actividadInterval = setInterval(function() {
      if (modoActual === "jugando" && !hablando && !modoEspera) {
        ACTIVIDADES[idxActividad % ACTIVIDADES.length]();
        idxActividad++;
      }
    }, 30 * 60 * 1000);
  }
}

// CHEQUEO SEGURIDAD
function hacerChequeo() {
  intentosChequeo = 0;
  esperandoChequeo = true;
  preguntarChequeo();
}

function preguntarChequeo() {
  const msgs = ["Coca, como estas? Solo quiero saber que estas bien.", "Coca, aca Florencia. Contame como estas.", "Coca, necesito saber como estas para no preocuparme."];
  const msg = msgs[Math.min(intentosChequeo, 2)];
  agregarBurbuja(msg, "sistema");
  hablar(msg);
  timerChequeo = setTimeout(function() {
    if (esperandoChequeo) {
      intentosChequeo++;
      if (intentosChequeo < 2) { preguntarChequeo(); }
      else { activarEmergenciaChequeo(); }
    }
  }, 2 * 60 * 1000);
}

function respuestaChequeoRecibida() {
  esperandoChequeo = false;
  intentosChequeo = 0;
  if (timerChequeo) clearTimeout(timerChequeo);
  registrarChequeoSheets("OK - respondio");
}

function activarEmergenciaChequeo() {
  agregarBurbuja("Coca no respondio. Avisando a la familia.", "sistema");
  hablar("No pude comunicarme con Coca. Aviso a la familia.");
  registrarChequeoSheets("ALERTA - no respondio");
  const msg = encodeURIComponent("ALERTA MARCOS: Coca no respondio al chequeo de " + new Date().toLocaleTimeString("es-AR") + ". Verificar urgente.");
  CONTACTOS.forEach(function(c) { window.open("https://wa.me/" + c.tel + "?text=" + msg, "_blank"); });
  setTimeout(function() { llamarContacto(0); }, 3000);
}

// INIT
function arrancar() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1,1,22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
  } catch(e) {}

  document.getElementById("pantalla-inicio").style.display = "none";
  document.getElementById("app").style.display = "flex";

  chequearResetAgua();
  actualizarBarraAgua();
  renderFamilia();
  renderPanelNoche();
  mantenerPantallaEncendida();
  chequearCumpleanos();

  // Leer modo desde panel familiar
  const modoGuardado = localStorage.getItem("modoCoca") || "en_casa";
  aplicarModo(modoGuardado);

  window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };

  // Iniciar microfono automaticamente y saludar
  setTimeout(function() {
    escuchaContinua = true;
    conversacionActiva = true;
    iniciarEscucha();
    setTimeout(function() {
      const saludo = "Hola Coca, soy Florencia. Que lindo escucharte. Como estas hoy?";
      agregarBurbuja(saludo, "asistente");
      hablar(saludo);
    }, 1500);
  }, 800);

  // Monitorear cambios de modo desde panel
  // activarModoSeguridad = aplicarModo("seguridad")
  setInterval(function() {
    const modo = localStorage.getItem("modoCoca") || "en_casa";
    if (modo !== modoActual) aplicarModo(modo);
  }, 5000);

  // Agua y bano proactivo (solo en modos activos)
  setInterval(function() {
    if (modoActual === "descanso" || hablando) return;
    const ahora = new Date();
    const min = ahora.getMinutes();
    const h = ahora.getHours();
    // Bano cada 90 min en horas activas
    if (min === 30 && [9,11,13,15,17,19].includes(h)) {
      proponer("Coca, hace un rato que estas sentada. Aprovecha e ida al bano ahora, asi despues estas mas tranquila.");
    }
    // Agua cada 2 horas
    if (min === 0 && [9,11,13,15,17,19].includes(h) && aguaMl < AGUA_META) {
      const vasosTomdos = Math.round(aguaMl / 250);
      const vasosFaltan = 6 - vasosTomdos;
      const msgs = [
        "Coca, cuantos vasos de agua tomaste hoy? La meta son 6 vasos, vamos llevando la cuenta juntos.",
        "Che Coca, llevamos " + vasosTomdos + " vasos de agua hoy. Te faltan " + vasosFaltan + " para llegar. Un vasito mas?",
        "Coca, un vaso de agua no te manda al bano de una - dale, son solo " + vasosFaltan + " vasos mas para llegar a la meta."
      ];
      proponer(msgs[Math.floor(Math.random() * msgs.length)]);
    }
  }, 30000);

  // Panel llamada 20hs y saludo 11am
  let saludoManianaDado = false;
  setInterval(function() {
    const ahora = new Date();
    const h = ahora.getHours();
    const m = ahora.getMinutes();
    const s = ahora.getSeconds();
    
    if (h === 20 && m === 0 && s < 15) mostrarPanelNoche();
    
    // Saludo 11am - solo una vez por dia
    if (h === 11 && m === 0 && s < 15 && !saludoManianaDado && modoActual !== "descanso") {
      saludoManianaDado = true;
      setTimeout(function() {
        const sal = "Hola Coca, soy Florencia. Como amaneciste hoy?";
        agregarBurbuja(sal, "asistente");
        hablar(sal);
      }, 1000);
    }
    // Reset saludo a medianoche
    if (h === 0 && m === 0) saludoManianaDado = false;
    
  }, 10000);
}

async function procesarMensaje(texto) {
  if (!texto.trim()) return;
  if (esperandoChequeo) respuestaChequeoRecibida();

  const t = texto.toLowerCase();
  
  // Detectar rechazo de remedios
  if (t.includes("no voy a tomar") || t.includes("no quiero tomar") || t.includes("no tomo")) {
    if (t.includes("remedio") || t.includes("pastilla") || t.includes("medicamento")) {
      remediosRechazados = true;
      protocoloRemediosActivo = true;
    }
  }
  // Detectar que acepto los remedios
  if (protocoloRemediosActivo && (t.includes("okay") || t.includes("voy a tomar") || t.includes("bueno") || t.includes("dale"))) {
    if (t.includes("pastilla") || t.includes("remedio") || t.includes("okay") || t.includes("dale")) {
      protocoloRemediosActivo = false;
      remediosRechazados = false;
    }
  }
  // Emergencia grave - alerta inmediata
  const emergenciaGrave = ["me cai","me caí","no puedo respirar","ayuda urgente","auxilio","emergencia","me desmaye"];
  if (emergenciaGrave.some(function(p){ return t.includes(p); })) {
    agregarBurbuja(texto, "coca"); setTimeout(mostrarAlerta, 500); return;
  }
  // Malestar - indagar Y avisar a familia silenciosamente
  const malestarLeve = ["me siento mal","no me siento bien","me duele mucho","me siento muy mal"];
  if (malestarLeve.some(function(p){ return t.includes(p); })) {
    if (ultimoMalestar && (Date.now() - ultimoMalestar < 3 * 60 * 1000)) {
      // Segunda vez en 3 minutos - activar alerta completa
      agregarBurbuja(texto, "coca"); setTimeout(mostrarAlerta, 500); return;
    }
    ultimoMalestar = Date.now();
    // Avisar a familia por WhatsApp silenciosamente
    const msgFam = encodeURIComponent("Florencia avisa: Coca dijo que no se siente bien. Por favor verificar como esta.");
    setTimeout(function() {
      CONTACTOS.slice(0,3).forEach(function(c) {
        window.open("https://wa.me/" + c.tel + "?text=" + msgFam, "_blank");
      });
    }, 2000);
    // Registrar en sheets
    enviarASheets({ tipo: "malestar", resumen: "Coca dijo: " + texto, estado: "MALESTAR - familia avisada", chequeo: new Date().toLocaleString("es-AR"), agua: (aguaMl/1000).toFixed(1) + "L" });
  }

  // Detectar reporte de agua
  const litrosMatch = texto.match(/(\d+[\.,]?\d*)\s*(litro|vaso|vasito|ml|mililitro)/i);
  if (litrosMatch) {
    let cantidad = parseFloat(litrosMatch[1].replace(",", "."));
    if (litrosMatch[2].toLowerCase().includes("vaso")) cantidad = 200;
    else if (litrosMatch[2].toLowerCase().includes("ml") || litrosMatch[2].toLowerCase().includes("mili")) cantidad = cantidad;
    else cantidad = cantidad * 1000; // litros a ml
    registrarAgua(Math.round(cantidad));
  }

  agregarBurbuja(texto, "coca");
  mostrarPensando();

  const ahora = new Date();
  const hora = ahora.toLocaleTimeString("es-AR", {hour:"2-digit", minute:"2-digit"});
  const fecha = ahora.toLocaleDateString("es-AR", {weekday:"long", day:"numeric", month:"long"});
  const diaNum = ahora.getDay();
  const arielOcupado = (diaNum === 1 || diaNum === 5) ? " (IMPORTANTE: hoy es lunes o viernes, Ariel da clases a la noche, no sugerir llamarlo)" : "";

  let infoBase = "[Son las " + hora + " del " + fecha + arielOcupado + ". Modo actual: " + modoActual + ". Agua tomada hoy: " + (aguaMl/1000).toFixed(1) + "L de 1.5L meta.";

  const tl = t;
  const pideCLima = tl.includes("clima") || tl.includes("temperatura") || tl.includes("calor") || 
    tl.includes("frio") || tl.includes("fría") || tl.includes("lluev") || tl.includes("ponerse") || 
    tl.includes("ponerme") || tl.includes("salir") || tl.includes("afuera") || tl.includes("pronostico") || 
    tl.includes("pronóstico") || tl.includes("mañana") || tl.includes("tiempo") || tl.includes("paraguas") ||
    tl.includes("abrigo") || tl.includes("tapado") || tl.includes("grados") || historial.length === 0;
  const pideNoticias = tl.includes("noticia") || tl.includes("novedad") || tl.includes("que paso") || tl.includes("contame") || tl.includes("paiva") || tl.includes("recreo") || tl.includes("radio") || tl.includes("power max") || tl.includes("pasando") || tl.includes("zona");
  const pideTele = tl.includes("tele") || tl.includes("telefe") || tl.includes("canal") || tl.includes("ver") || tl.includes("mirar") || tl.includes("programa") || tl.includes("novela") || tl.includes("pelicula") || tl.includes("flow");
  const pideHoro = tl.includes("horoscopo") || tl.includes("horóscopo") || tl.includes("signo") || 
    tl.includes("sagitario") || tl.includes("astro") || tl.includes("planeta") || tl.includes("estrella");

  if (pideCLima) {
    try { const c = await obtenerClima(tl.includes("pronostico") || tl.includes("semana")); infoBase += " Clima Laguna Paiva: " + c + "."; } catch(e) {}
  }
  if (pideNoticias) {

  }
  if (pideHoro) {

  }

  if (pideTele) {
    try { const prog = await obtenerProgramacionTelefe(); infoBase += " PROGRAMACION TELEFE AHORA: " + prog; } catch(e) {}
  }

  const infoFamiliar = localStorage.getItem("coca_estado");
  if (infoFamiliar) infoBase += " Estado segun familia: " + infoFamiliar + ".";

  const memoria = cargarMemoria();
  if (memoria) infoBase += " [CONTEXTO PREVIO - usar solo como referencia, NUNCA repetir textualmente ni afirmar como hecho cierto lo que dice aqui: " + memoria + "]";

  infoBase += "]";
  const contexto = infoBase + "\n" + texto;
  historial.push({ role: "user", content: contexto });

  // Sugerencia proactiva cada 6 intercambios
  if (historial.length % 12 === 0 && modoActual !== "descanso") {
    const sugs = ["[Sugerencia: ofrece una noticia de Paiva o preguntale algo de su pasado]", "[Sugerencia: preguntale sobre Lali o Tami que vive al lado]", "[Sugerencia: propone una cancion de tango o cumbia]"];
    historial[historial.length-1].content += "\n" + sugs[Math.floor(Math.random() * sugs.length)];
  }

  try {
    const res = await fetch(CLAUDE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": CLAUDE_KEY, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: "claude-haiku-4-5-20251001", max_tokens: 220, system: SYSTEM, messages: historial })
    });
    const data = await res.json();
    quitarPensando();
    if (data.error) throw new Error(data.error.message);
    const respuesta = data.content[0].text || "No te escuche bien. Podés repetir?";
    historial.push({ role: "assistant", content: respuesta });

    // Detectar musica, contactar o respuesta normal
    const musicaMatch = respuesta.match(/MUSICA:([^:]+):([^\n]+)/i);
    const contactarMatch = respuesta.match(/CONTACTAR:(\w+):(whatsapp|llamar)/i);
    
    if (musicaMatch) {
      const artista = musicaMatch[1].trim();
      const cancion = musicaMatch[2].trim();
      const limpio = respuesta.replace(/MUSICA:[^:]+:[^\n]+/i, "").trim();
      if (limpio) { agregarBurbuja(limpio, "asistente"); hablar(limpio); }

        window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(artista + " " + cancion), "_blank");
      }, 1500);
    } else if (contactarMatch) {
      const ci = CONTACTOS.findIndex(function(c){ return c.nombre.toLowerCase() === contactarMatch[1].toLowerCase(); });
      const limpio = respuesta.replace(/CONTACTAR:\w+:\w+/i, "").trim();
      if (limpio) { agregarBurbuja(limpio, "asistente"); hablar(limpio); }
      if (ci >= 0) setTimeout(function(){ llamarContacto(ci); }, 1200);
    } else {
      agregarBurbuja(respuesta, "asistente");
      hablar(respuesta);
    }

    // Guardar memoria cada 4 intercambios
    intercambiosGuardado++;
    if (intercambiosGuardado >= 4) { intercambiosGuardado = 0; actualizarMemoria(); }

  } catch(e) {
    quitarPensando();
    // Error graceful - no decir "tuve un problema", intentar responder algo util
    const respuestasError = [
      "Perdon Coca, no te escuche bien. Podés repetir?",
      "Coca, se me fue un momento. Me repetis?",
      "No te entendi bien, Coca. De nuevo?",
    ];
    const err = respuestasError[Math.floor(Math.random() * respuestasError.length)];
    agregarBurbuja(err, "asistente"); hablar(err);
  }
}

// CLIMA
async function obtenerClima(completo) {
  try {
    const lat = -31.3167, lon = -60.6667;
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + 
      "&current=temperature_2m,apparent_temperature,weathercode,windspeed_10m,relativehumidity_2m" +
      "&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_sum" +
      "&timezone=America%2FArgentina%2FBuenos_Aires&forecast_days=3";
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data.current) throw new Error("No current data");
    const temp = Math.round(data.current.temperature_2m);
    const sensacion = Math.round(data.current.apparent_temperature);
    const humedad = data.current.relativehumidity_2m;
    const desc = {
      0:"cielo despejado", 1:"mayormente despejado", 2:"parcialmente nublado", 3:"nublado",
      45:"niebla", 51:"llovizna leve", 61:"lluvia leve", 63:"lluvia", 65:"lluvia intensa",
      71:"nieve", 80:"lluvias", 95:"tormenta"
    };
    const d = desc[data.current.weathercode] || "variable";
    if (!completo) {
      return "En Laguna Paiva ahora: " + temp + " grados, " + d + ", sensacion termica " + sensacion + " grados, humedad " + humedad + "%";
    }
    const dias = ["Hoy","Manana","Pasado manana"];
    let p = "Ahora en Laguna Paiva: " + temp + " grados, " + d + ". ";
    if (data.daily && data.daily.time) {
      data.daily.time.forEach(function(f,i) {
        if(i>=3) return;
        const min = Math.round(data.daily.temperature_2m_min[i]);
        const max = Math.round(data.daily.temperature_2m_max[i]);
        const lluvia = data.daily.precipitation_sum[i] > 0 ? ", lluvia " + data.daily.precipitation_sum[i] + "mm" : "";
        p += dias[i] + ": minima " + min + " maxima " + max + " grados" + lluvia + ". ";
      });
    }
    return p;
  } catch(e) {
    return "No pude obtener el clima en este momento";
  }
}

// VOZ
function limpiarEmojis(texto) {
  return texto.replace(/[\u{1F000}-\u{1FFFF}]/gu,"").replace(/[\u{2600}-\u{27BF}]/gu,"").replace(/\s+/g," ").trim();
}
function elegirVozFemenina() {
  const voces = window.speechSynthesis.getVoices();
  // Buscar voz femenina en español
  const femeninas = ["female","mujer","woman","monica","paulina","lucia","carmen","rosa","maria","helena","ines","pilar","soledad","gabriela","natalia","valentina","laura","sofia"];
  // Primero buscar femenina en español
  let voz = voces.find(function(v) {
    const n = v.name.toLowerCase();
    return v.lang.toLowerCase().startsWith("es") && femeninas.some(function(f){ return n.includes(f); });
  });
  // Si no, cualquier voz en español
  if (!voz) voz = voces.find(function(v){ return v.lang.toLowerCase().startsWith("es"); });
  // Si no, primera disponible
  if (!voz && voces.length > 0) voz = voces[0];
  return voz;
}

function hablar(texto) {
  texto = limpiarEmojis(texto);
  if (!("speechSynthesis" in window)) return;
  hablando = true;
  uiEscuchandoActivo = false;
  escuchaContinua = false; // Detener escucha mientras habla
  if (grabando && reconocimiento) { 
    try { reconocimiento.abort(); } catch(e) {}
    try { reconocimiento.stop(); } catch(e) {}
    grabando = false;
  }
  document.getElementById("btn-mic").style.opacity = "0.4";
  document.getElementById("btn-mic").style.pointerEvents = "none";
  
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = "es-AR";
  u.rate = 0.88;
  u.pitch = 1.15; // Mas agudo para voz femenina
  u.volume = 1;
  
  const voz = elegirVozFemenina();
  if (voz) u.voice = voz;
  
  u.onend = function() {
    // Esperar 1.5 segundos despues de hablar antes de reactivar el mic
    // para evitar que capture el eco de la propia voz
    setTimeout(function() {
      hablando = false;
      escuchaContinua = true; // Reactivar escucha
      document.getElementById("btn-mic").style.opacity = "1";
      document.getElementById("btn-mic").style.pointerEvents = "auto";
      if (!modoEspera) setTimeout(iniciarEscucha, 800);
      else setTimeout(iniciarEscucha, 1500);
    }, 1500);
  };
  
  u.onerror = function() {
    hablando = false;
    document.getElementById("btn-mic").style.opacity = "1";
    document.getElementById("btn-mic").style.pointerEvents = "auto";
  };
  
  window.speechSynthesis.speak(u);
}

// MIC
function toggleMic() {
  if (hablando) { window.speechSynthesis.cancel(); hablando = false; document.getElementById("btn-mic").style.opacity = "1"; document.getElementById("btn-mic").style.pointerEvents = "auto"; }
  if (grabando) { escuchaContinua = false; modoEspera = false; uiEscuchandoActivo = false; if (reconocimiento) reconocimiento.stop(); setUIDefault(); return; }
  silenciosConsecutivos = 0; modoEspera = false; conversacionActiva = true; escuchaContinua = true;
  iniciarEscucha();
}

function setUIDefault() {
  uiEscuchandoActivo = false;
  document.getElementById("btn-mic").classList.remove("escuchando","espera");
  document.getElementById("mic-icon").textContent = "🎤";
  document.getElementById("mic-dot").classList.remove("activo","espera");
  document.getElementById("mic-texto").textContent = "Toca el microfono para hablar";
  document.getElementById("mic-hint").textContent = "Toca para hablar";
}

function iniciarEscucha() {
  if (hablando) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  reconocimiento = new SR();
  reconocimiento.lang = "es-AR"; reconocimiento.interimResults = false; reconocimiento.continuous = true; reconocimiento.maxAlternatives = 1;

  reconocimiento.onstart = function() {
    grabando = true;
    if (modoEspera) {
      document.getElementById("btn-mic").classList.remove("escuchando");
      document.getElementById("btn-mic").classList.add("espera");
      document.getElementById("mic-icon").textContent = "👂";
      document.getElementById("mic-dot").classList.remove("activo");
      document.getElementById("mic-dot").classList.add("espera");
      document.getElementById("mic-texto").textContent = "Decí Florencia para seguir charlando";
      document.getElementById("mic-hint").textContent = "O toca el boton";
    } else {
      // Solo actualizar UI la primera vez, no en cada reinicio
      if (!uiEscuchandoActivo) {
        uiEscuchandoActivo = true;
        document.getElementById("btn-mic").classList.add("escuchando");
        document.getElementById("btn-mic").classList.remove("espera");
        document.getElementById("mic-icon").textContent = "⏹";
        document.getElementById("mic-dot").classList.add("activo");
        document.getElementById("mic-dot").classList.remove("espera");
        document.getElementById("mic-texto").textContent = "Escuchando...";
        document.getElementById("mic-hint").textContent = "Toca para pausar";
      }
    }
  };

  reconocimiento.onresult = function(e) {
    // Resetear silencios con cualquier deteccion de voz
    silenciosConsecutivos = 0;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      const texto = e.results[i][0].transcript.trim();
      if (!texto) continue;
      const tl = texto.toLowerCase();

      if (modoEspera) {
        if (WAKE_WORDS.some(function(w){ return tl.includes(w); })) {
          modoEspera = false; silenciosConsecutivos = 0; conversacionActiva = true;
          document.getElementById("btn-mic").classList.remove("espera"); document.getElementById("btn-mic").classList.add("escuchando");
          document.getElementById("mic-icon").textContent = "⏹"; document.getElementById("mic-dot").classList.remove("espera"); document.getElementById("mic-dot").classList.add("activo");
          document.getElementById("mic-texto").textContent = "Escuchando...";
          if (PALABRAS_EMERGENCIA.some(function(p){ return tl.includes(p); })) { mostrarAlerta(); return; }
          const sal = "Hola Coca, aca estoy. Que necesitas?"; agregarBurbuja(sal, "asistente"); hablar(sal);
        }
        return;
      }
      if (PALABRAS_CIERRE.some(function(w){ return tl.includes(w); })) { terminarConversacion(); return; }
      if (PALABRAS_EMERGENCIA.some(function(p){ return tl.includes(p); })) { mostrarAlerta(); return; }
      silenciosConsecutivos = 0;
      procesarMensaje(texto);
    }
  };

  reconocimiento.onend = function() {
    grabando = false;
    if (!escuchaContinua) { 
      uiEscuchandoActivo = false;
      setUIDefault(); 
      return; 
    }
    // No cambiar UI si vamos a reiniciar enseguida
    if (!hablando) {
      setTimeout(iniciarEscucha, modoEspera ? 2000 : 1500);
    }
  };

  reconocimiento.onerror = function(e) {
    grabando = false;
    if (e.error === "no-speech") {
      if (!modoEspera && conversacionActiva) {
        silenciosConsecutivos++;
        if (silenciosConsecutivos >= MAX_SILENCIOS) { verificarFin(); return; }
      }
      if (escuchaContinua && !hablando) setTimeout(iniciarEscucha, 1500);
      return;
    }
    if (e.error !== "aborted" && escuchaContinua && !hablando) setTimeout(iniciarEscucha, 2000);
  };

  reconocimiento.start();
}

function verificarFin() {
  silenciosConsecutivos = 0;
  const msg = "Coca, seguimos charlando o preferes descansar?";
  agregarBurbuja(msg, "asistente"); hablar(msg);
  setTimeout(function() { if (conversacionActiva && silenciosConsecutivos >= 6) terminarConversacion(); }, 120000);
}

async function mantenerPantallaEncendida() {
  if ("wakeLock" in navigator) {

  }
}
